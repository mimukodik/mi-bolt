      - termsVersion
      - acceptedTerms
      properties:
        paymentMethod:
          type: string
          enum:
          - card
        paymentIntentId:
          type: string
        termsVersion:
          type: string
        acceptedTerms:
          type: boolean
          description: False is rejected with 422 and a field error on /acceptedTerms,
            so the user interface can highlight the checkbox.
    CashOnDeliveryOrderRequest:
      type: object
      additionalProperties: false
      required:
      - paymentMethod
      - termsVersion
      - acceptedTerms
      properties:
        paymentMethod:
          type: string
          enum:
          - cash_on_delivery
        termsVersion:
          type: string
        acceptedTerms:
          type: boolean
    OrderRequest:
      description: Card orders carry a payment intent; cash on delivery has no such
        member.
      oneOf:
      - $ref: '#/components/schemas/CardOrderRequest'
      - $ref: '#/components/schemas/CashOnDeliveryOrderRequest'
      discriminator:
        propertyName: paymentMethod
        mapping:
          card: '#/components/schemas/CardOrderRequest'
          cash_on_delivery: '#/components/schemas/CashOnDeliveryOrderRequest'
    OrderLine:
      type: object
      additionalProperties: false
      required:
      - productName
      - variantId
      - colorName
      - storageGb
      - quantity
      - unitPrice
      - lineTotal
      properties:
        productName:
          type: string
        variantId:
          type: string
        colorName:
          type: string
        storageGb:
          $ref: '#/components/schemas/StorageGb'
        quantity:
          type: integer
          minimum: 1

            $ref: '#/components/schemas/DeliveryOption'
          minItems: 1
        paymentMethods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodOption'
          minItems: 1
        termsVersion:
          type: string
          description: The terms version currently in force. The order echoes it back.
    HomeDeliverySelection:
      type: object
      additionalProperties: false
      required:
      - optionId
      - address
      properties:
        optionId:
          type: string
          enum:
          - home_delivery

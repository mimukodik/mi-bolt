          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
    OrderReceipt:
      type: object
      additionalProperties: false
      description: >-
        A full confirmation: what was ordered, where it is going and who it is
        invoiced to. Readable only by the session that placed it.
      required:
      - id
      - orderNumber
      - createdAt
      - status
      - items
      - subtotal
      - shippingFee
      - paymentFee
      - total
      - paymentMethod
      - delivery
      - billing
      - contactEmail
      - notice
      properties:
        id:
          type: string
        orderNumber:
          type: string
          pattern: ^DEMO-[0-9]{6}$
          description: The DEMO prefix is deliberate and visible; it tells the shopper
            no real purchase was made.
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - confirmed
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
          minItems: 1
        subtotal:
          $ref: '#/components/schemas/Money'
        shippingFee:
          $ref: '#/components/schemas/Money'
        paymentFee:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodId'
        delivery:
          $ref: '#/components/schemas/DeliverySelection'
        billing:
          $ref: '#/components/schemas/BillingDetails'
        contactEmail:
          type: string
          format: email
        notice:
          type: string
          description: Shopper-facing disclosure that no real payment, shipment or
            email took place.

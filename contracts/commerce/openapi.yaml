openapi: 3.1.0
info:
  title: MiBolt Commerce API
  version: 2.4.0
  description: >-
    Contract-first commerce API for the MiBolt webshop. No real payment,
    fulfillment or email takes place; the shop is a demonstration and says so in
    its user interface.


    Session handling: an anonymous session cookie identifies the shopper. The
    cart and the checkout draft are server-side state bound to that session, so
    every browser tab of the same browser sees the same cart.


    Concurrency: the cart and the checkout draft share a single version counter.
    Every successful mutation increments it, every affected response carries it
    as an ETag, and every mutation requires it in an If-Match header. A failed
    precondition returns 412.


    Money: whole Hungarian forints, never ISO minor units.


    Error text: responses carry machine-readable codes and parameters. The
    title and detail members are English developer diagnostics and are never
    displayed to shoppers; the user interface composes all shopper-facing text
    from the code. Content such as product names, highlights, specification rows
    and option labels is server-side data and is returned in Hungarian.


    Demo access: the demo shop is not public. POST /demo/session with the demo
    password issues the demo access cookie (mibolt_demo_access, 30 days), and
    every shop operation except the two /demo/session operations answers 401
    UNAUTHENTICATED without it, catalogue images included.


    Admin API: every operation under /admin serves the separate admin
    application and is authenticated by the admin session cookie
    (mibolt_admin_session) that POST /admin/auth/login issues. Every POST, PUT
    and DELETE under /admin must also carry an X-XSRF-TOKEN header equal to
    the XSRF-TOKEN cookie, which GET /admin/auth/session issues. Shop
    operations never read either cookie.
  contact:
    name: MiBolt
    url: https://example.test/mi-bolt
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: /api/v1
  description: Same-origin logical endpoint. The runtime root respects the application
    base href.
security: []
tags:
- name: Catalog
  description: Product search, product detail and related products. Needs the demo access cookie.
- name: Cart
  description: Server-side cart bound to the session cookie.
- name: Checkout
  description: Delivery and payment options, and the persistent checkout draft.
- name: Payment
  description: Redirect-based payment authorisation.
- name: Orders
  description: Order placement and the order receipt.
- name: Media
  description: Catalogue image delivery. Needs the demo access cookie.
- name: DemoAccess
  description: Password-only demo sign-in that issues the demo access cookie.
- name: AdminAuth
  description: Admin sign-in, session and own password. Admin application only.
- name: AdminUsers
  description: Admin account management. Admin application only.
- name: AdminProducts
  description: Catalogue maintenance, archived products included. Admin application only.
- name: AdminMedia
  description: Catalogue image upload. Admin application only.
paths:
  /promotion:
    get:
      operationId: getPromotion
      tags: [Catalog]
      summary: Read the shared campaign and server time
      security:
      - demoAccess: []
      responses:
        '200':
          description: Shared campaign; active uses startsAt <= serverNow < endsAt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promotion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/promotion:
    get:
      operationId: getAdminPromotion
      tags: [AdminProducts]
      summary: Read the single shared campaign
      security:
      - adminSession: []
      responses:
        '200':
          description: Campaign configuration and version.
          headers:
            ETag:
              $ref: '#/components/headers/ProductETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPromotion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceAdminPromotion
      tags: [AdminProducts]
      summary: Replace or clear the shared campaign
      description: All three fields must be supplied together. An empty object clears the campaign. Times are offset instants, displayed in Europe/Budapest. Concurrent changes return PRODUCT_VERSION_CONFLICT.
      parameters:
      - $ref: '#/components/parameters/ProductIfMatch'
      security:
      - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPromotionInput'
      responses:
        '200':
          description: Saved campaign.
          headers:
            ETag:
              $ref: '#/components/headers/ProductETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPromotion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/ProductPreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /products:
    get:
      operationId: listProducts
      tags:
      - Catalog
      summary: Search and filter the catalogue
      description: >-
        One list entry is a (product, storage) pair, so every entry carries one
        concrete price and no "from" pricing is needed. Colours stay inside the
        entry: the colours array lets the card switch colour, which changes the
        price, the image and the link target.


        Filters apply conjunctively across facets and disjunctively within a
        facet. Facet counts are disjunctive: a facet's own selection is removed
        before counting. total counts list entries. Unknown query parameters
        return 400. A page beyond the last one returns an empty items array with
        total, totalPages and the requested page unchanged, so the client can
        navigate without a second request.


        The recommended order is the curated rank, with product id as a stable
        tie-break, and storage ascending inside one product. When q is present,
        recommended means relevance.
      parameters:
      - name: q
        in: query
        description: Case-insensitive, NFC-normalised substring over brand and name.
          Trimmed.
        schema:
          type: string
          maxLength: 100
      - name: brand
        in: query
        description: Repeatable. OR within this facet, AND across facets.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: storageGb
        in: query
        description: Repeatable. OR within this facet.
        schema:
          type: array
          items:
            $ref: '#/components/schemas/StorageGb'
        style: form
        explode: true
      - name: color
        in: query
        description: Repeatable colour code. OR within this facet.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: minPrice
        in: query
        description: Inclusive lower bound in whole HUF. Must not exceed maxPrice.
        schema:
          type: integer
          minimum: 0
      - name: maxPrice
        in: query
        description: Inclusive upper bound in whole HUF.
        schema:
          type: integer
          minimum: 0
      - name: inStock
        in: query
        schema:
          type: boolean
      - name: is5g
        in: query
        schema:
          type: boolean
      - name: featured
        in: query
        description: Curated selection for the home page. At most four entries, in
          curated order.
        schema:
          type: boolean
      - name: onPromotion
        in: query
        description: Restrict matching variants to active in-stock sale prices.
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          $ref: '#/components/schemas/ProductSort'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          enum:
          - 12
          - 24
          default: 12
      security:
      - demoAccess: []
      responses:
        '200':
          description: A page of catalogue entries with facet counts.
          headers:
            Cache-Control:
              description: Revalidated on every use, so a changed product or image
                shows on the next load.
              schema:
                type: string
                examples:
                - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /products/{slug}:
    get:
      operationId: getProduct
      tags:
      - Catalog
      summary: Read a product with its complete variant matrix
      description: >-
        Returns every colour and storage combination. The client resolves the
        variant from its own route segment against variantSlug, which is unique
        inside one product.
      parameters:
      - $ref: '#/components/parameters/ProductSlug'
      security:
      - demoAccess: []
      responses:
        '200':
          description: The product and every variant.
          headers:
            Cache-Control:
              description: Revalidated on every use, so a changed product or image
                shows on the next load.
              schema:
                type: string
                examples:
                - no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /products/{slug}/related:
    get:
      operationId: listRelatedProducts
      tags:
      - Catalog
      summary: Read related products for the product detail page
      description: Loaded separately from the product so the page can render a
        placeholder while the recommendations arrive.
      parameters:
      - $ref: '#/components/parameters/ProductSlug'
      security:
      - demoAccess: []
      responses:
        '200':
          description: Related catalogue entries, at most four, in relevance order.
          headers:
            Cache-Control:
              description: Revalidated on every use, so a changed product or image
                shows on the next load.
              schema:
                type: string
                examples:
                - no-cache
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogItem'
                maxItems: 4
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /media/{imageId}:
    get:
      operationId: getMedia
      tags:
      - Media
      summary: Serve a catalogue image
      description: >-
        Returns the image bytes for a media identifier. It needs the demo access
        cookie like every shop operation, but no session, because images carry
        nothing session-specific.


        The identifier is content-addressed, so a changed image gets a new
        identifier and an old URL never serves new bytes. Responses are therefore
        safe to cache indefinitely.


        Clients never build this URL themselves. Every image carries a ready-to-use
        `src`, and the client puts that value into the markup unchanged. That is
        what makes a later move to a content delivery network a change of stored
        values rather than a change of contract.
      security:
      - demoAccess: []
      parameters:
      - $ref: '#/components/parameters/ImageId'
      responses:
        '200':
          description: The image bytes.
          headers:
            Cache-Control:
              description: Long-lived and immutable, because identifiers are content-addressed.
              schema:
                type: string
                examples:
                - public, max-age=31536000, immutable
          content:
            image/webp:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cart:
    get:
      operationId: getCart
      tags:
      - Cart
      summary: Read the current cart
      description: >-
        Returns the cart bound to the session, creating an empty one if the
        session has none. After an order is placed the session receives a fresh
        empty cart, so this operation never returns an already ordered cart.
      security:
      - demoAccess: []
        sessionCookie: []
      responses:
        '200':
          description: The current cart.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cart/items:
    post:
      operationId: addCartItem
      tags:
      - Cart
      summary: Add a variant to the cart, merging with an existing line
      description: >-
        A repeated variant merges into the existing line, so one variant is
        always exactly one line. The merged quantity must not exceed the line
        maximum; a larger request is rejected rather than silently truncated,
        because the client already holds the whole cart and can prevent it.


        Server-initiated adjustments — a stock drop, a price change, an item that
        sold out — are reported in the cart's notices array instead.
      security:
      - demoAccess: []
        sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: The updated cart.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The variant cannot be added in the requested quantity.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                outOfStock:
                  summary: OUT_OF_STOCK
                  value:
                    type: urn:mi-bolt:problem:out-of-stock
                    title: Variant is not orderable
                    status: 409
                    code: OUT_OF_STOCK
                    detail: The selected variant has no stock left.
                    traceId: 01JB8X5Q2T
                    fieldErrors: []
                quantityLimit:
                  summary: QUANTITY_LIMIT
                  value:
                    type: urn:mi-bolt:problem:quantity-limit
                    title: Quantity limit exceeded
                    status: 409
                    code: QUANTITY_LIMIT
                    detail: Merged quantity would exceed the line maximum.
                    traceId: 01JB8X5Q2U
                    params:
                      max: 5
                      requested: 7
                    fieldErrors: []
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: clearCart
      tags:
      - Cart
      summary: Remove every line from the cart
      description: Empties the cart in one request. The cart and the session survive,
        and the version is incremented once.
      security:
      - demoAccess: []
        sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The emptied cart.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cart/items/{variantId}:
    parameters:
    - $ref: '#/components/parameters/VariantId'
    patch:
      operationId: setCartItemQuantity
      tags:
      - Cart
      summary: Set the absolute quantity of a cart line
      description: The quantity is absolute, never a delta, so a retried request
        cannot double it.
      security:
      - demoAccess: []
        sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCartItemQuantityRequest'
      responses:
        '200':
          description: The updated cart.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: removeCartItem
      tags:
      - Cart
      summary: Remove a cart line
      description: >-
        Idempotent. A variant that exists in the catalogue but is no longer in
        the cart returns 200 with the current cart, because the requested end
        state already holds. A variant unknown to the catalogue returns 404.
      security:
      - demoAccess: []
        sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The updated cart.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /checkout/options:
    get:
      operationId: getCheckoutOptions
      tags:
      - Checkout
      summary: Read the delivery and payment options available for this cart
      description: >-
        The options depend on the cart, so this operation is session-scoped and
        is not globally cacheable. The shipping fee reflects any free-delivery
        threshold, and an option that the cart value rules out is returned with
        available set to false and a reason code the user interface can explain.
      security:
      - demoAccess: []
        sessionCookie: []
      responses:
        '200':
          description: The available options and the current terms version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOptions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /checkout:
    get:
      operationId: getCheckout
      tags:
      - Checkout
      summary: Read the checkout draft and the current totals
      description: >-
        The draft persists with the cart, survives reloads and tab switches, and
        is cleared when the order is placed. The summary is recomputed on every
        read, so it is always current; there is no separate quote step.
      security:
      - demoAccess: []
        sessionCookie: []
      responses:
        '200':
          description: The checkout draft with freshly computed totals.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateCheckout
      tags:
      - Checkout
      summary: Merge one or more sections into the checkout draft
      description: >-
        Only the supplied sections are validated and written; absent sections are
        retained. Partial state is allowed until the order is placed. Paid extras
        are never added implicitly.
      security:
      - demoAccess: []
        sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCheckoutRequest'
      responses:
        '200':
          description: The updated draft with recomputed totals.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: A section is syntactically valid but not acceptable.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                validationFailed:
                  summary: VALIDATION_FAILED
                  value:
                    type: urn:mi-bolt:problem:validation-failed
                    title: Section rejected
                    status: 422
                    code: VALIDATION_FAILED
                    detail: One or more supplied fields are not acceptable.
                    traceId: 01JB8X5Q2V
                    fieldErrors:
                    - path: /contact/phone
                      code: PHONE_FORMAT
                    - path: /billing/address/postalCode
                      code: POSTAL_CODE_FORMAT
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /payment-intents:
    post:
      operationId: createPaymentIntent
      tags:
      - Payment
      summary: Start a redirect-based payment authorisation
      description: >-
        Permitted for card payment only, and only when the checkout draft is
        complete. No card number, verification code or expiry is ever requested
        by this API.


        The response carries the address the shopper is sent to and the address
        they come back to. The outcome is read afterwards with getPaymentIntent;
        declined and pending are ordinary outcomes, not server errors.


        Idempotency: a retry after an uncertain response repeats the original
        key, so no second authorisation is started. A deliberate new attempt
        after a decline uses a new key.
      security:
      - demoAccess: []
        sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: The authorisation was started.
          headers:
            Location:
              description: The address of the created payment intent.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '409':
          description: The request conflicts with current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                idempotencyConflict:
                  summary: IDEMPOTENCY_CONFLICT
                  value:
                    type: urn:mi-bolt:problem:idempotency-conflict
                    title: Key reused with a different request
                    status: 409
                    code: IDEMPOTENCY_CONFLICT
                    detail: The idempotency key was already used with a different
                      request.
                    traceId: 01JB8X5Q2W
                    fieldErrors: []
                priceChanged:
                  summary: PRICE_CHANGED
                  value:
                    type: urn:mi-bolt:problem:price-changed
                    title: Catalogue price changed
                    status: 409
                    code: PRICE_CHANGED
                    detail: Cart prices were updated; the shopper must review the new
                      total.
                    traceId: 01JB8X5Q2X
                    fieldErrors: []
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: The checkout draft does not permit payment yet.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                checkoutIncomplete:
                  summary: CHECKOUT_INCOMPLETE
                  value:
                    type: urn:mi-bolt:problem:checkout-incomplete
                    title: Checkout is incomplete
                    status: 422
                    code: CHECKOUT_INCOMPLETE
                    detail: Contact, billing, delivery or payment is missing.
                    traceId: 01JB8X5Q2Y
                    fieldErrors:
                    - path: /billing
                      code: SECTION_MISSING
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /payment-intents/{paymentIntentId}:
    get:
      operationId: getPaymentIntent
      tags:
      - Payment
      summary: Read the outcome of a payment authorisation
      description: Read after the shopper returns. A pending intent reaches a terminal
        status before expiresAt.
      security:
      - demoAccess: []
        sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/PaymentIntentId'
      responses:
        '200':
          description: The payment intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /payment-intents/{paymentIntentId}/outcome:
    post:
      operationId: resolvePaymentIntent
      tags:
      - Payment
      summary: Report the outcome of a payment authorisation
      description: >-
        Called by the demo payment page to report what the shopper chose.


        This operation exists only because there is no real payment provider. In
        a live system the provider reports the outcome out of band, and a browser
        could never decide whether its own payment succeeded. Do not carry this
        operation over to a live integration.


        Only the session that owns the intent may call it. It is one-shot: an
        intent that already reached a terminal status cannot be changed, and a
        repeat call returns 409. A caller that lost the response should read the
        intent with getPaymentIntent rather than calling again.
      security:
      - demoAccess: []
        sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/PaymentIntentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentOutcomeRequest'
      responses:
        '200':
          description: The updated payment intent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The intent already reached a terminal status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                alreadyResolved:
                  summary: PAYMENT_ALREADY_RESOLVED
                  value:
                    type: urn:mi-bolt:problem:payment-already-resolved
                    title: Payment intent already resolved
                    status: 409
                    code: PAYMENT_ALREADY_RESOLVED
                    detail: The intent reached a terminal status and cannot be changed.
                    traceId: 01JB8X5Q38
                    fieldErrors: []
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders:
    post:
      operationId: createOrder
      tags:
      - Orders
      summary: Place the order in one atomic step
      description: >-
        A stored idempotency result is replayed before the cart state or the
        precondition is examined, so a retry after an uncertain response returns
        the original receipt rather than an error.


        Otherwise the operation validates the draft, the stock and the consent,
        decrements stock, stores the receipt, closes the cart and clears the
        draft. The session immediately receives a fresh empty cart. Price,
        delivery and contact data are never accepted from this request as an
        authority; they are read from the checkout draft.


        For a card order every status of the referenced payment intent maps to a
        definite answer: succeeded proceeds, requires_action returns 422
        PAYMENT_REQUIRED because the shopper never completed the payment page,
        pending returns 422 PAYMENT_PENDING because the outcome has not settled,
        and declined returns 422 PAYMENT_DECLINED.
        A succeeded intent backs one order only: an intent that an earlier
        order already carries returns 422 PAYMENT_REQUIRED, and the next card
        order needs a new payment.
      security:
      - demoAccess: []
        sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: The order was placed.
          headers:
            Location:
              description: The address of the created order.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '409':
          description: The order conflicts with current state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                outOfStock:
                  summary: OUT_OF_STOCK
                  value:
                    type: urn:mi-bolt:problem:out-of-stock
                    title: A line is no longer available
                    status: 409
                    code: OUT_OF_STOCK
                    detail: Stock ran out while the shopper was in checkout.
                    traceId: 01JB8X5Q30
                    fieldErrors: []
                priceChanged:
                  summary: PRICE_CHANGED
                  value:
                    type: urn:mi-bolt:problem:price-changed
                    title: Catalogue price changed
                    status: 409
                    code: PRICE_CHANGED
                    detail: Cart prices were updated; the shopper must review the new
                      total.
                    traceId: 01JB8X5Q31
                    fieldErrors: []
                idempotencyConflict:
                  summary: IDEMPOTENCY_CONFLICT
                  value:
                    type: urn:mi-bolt:problem:idempotency-conflict
                    title: Key reused with a different request
                    status: 409
                    code: IDEMPOTENCY_CONFLICT
                    detail: The idempotency key was already used with a different
                      request.
                    traceId: 01JB8X5Q32
                    fieldErrors: []
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: The order is not acceptable in its current form.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                termsNotAccepted:
                  summary: VALIDATION_FAILED on the terms checkbox
                  value:
                    type: urn:mi-bolt:problem:validation-failed
                    title: Terms not accepted
                    status: 422
                    code: VALIDATION_FAILED
                    detail: The terms must be accepted to place an order.
                    traceId: 01JB8X5Q33
                    fieldErrors:
                    - path: /acceptedTerms
                      code: TERMS_NOT_ACCEPTED
                checkoutIncomplete:
                  summary: CHECKOUT_INCOMPLETE
                  value:
                    type: urn:mi-bolt:problem:checkout-incomplete
                    title: Checkout is incomplete
                    status: 422
                    code: CHECKOUT_INCOMPLETE
                    detail: A required checkout section is missing.
                    traceId: 01JB8X5Q34
                    fieldErrors:
                    - path: /delivery
                      code: SECTION_MISSING
                paymentRequired:
                  summary: PAYMENT_REQUIRED
                  value:
                    type: urn:mi-bolt:problem:payment-required
                    title: Payment not completed
                    status: 422
                    code: PAYMENT_REQUIRED
                    detail: The referenced payment intent still requires action from the
                      shopper.
                    traceId: 01JB8X5Q35
                    fieldErrors: []
                paymentPending:
                  summary: PAYMENT_PENDING
                  value:
                    type: urn:mi-bolt:problem:payment-pending
                    title: Payment still settling
                    status: 422
                    code: PAYMENT_PENDING
                    detail: The referenced payment intent has not reached a terminal status
                      yet.
                    traceId: 01JB8X5Q36
                    fieldErrors: []
                paymentDeclined:
                  summary: PAYMENT_DECLINED
                  value:
                    type: urn:mi-bolt:problem:payment-declined
                    title: Payment was declined
                    status: 422
                    code: PAYMENT_DECLINED
                    detail: The referenced payment intent was declined. A new attempt needs
                      a new idempotency key.
                    traceId: 01JB8X5Q37
                    fieldErrors: []
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags:
      - Orders
      summary: Read an order receipt
      description: Only the session that placed the order can read it; any other
        session receives 404.
      security:
      - demoAccess: []
        sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /demo/session:
    get:
      operationId: getDemoSession
      tags:
      - DemoAccess
      summary: Check the demo access cookie
      description: >-
        Answers 204 when the request carries a valid demo access cookie and 401
        otherwise, so the storefront knows whether to show its sign-in page.
      security:
      - demoAccess: []
      - {}
      responses:
        '204':
          description: The demo access cookie is valid.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DemoAccessRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createDemoSession
      tags:
      - DemoAccess
      summary: Sign in to the demo with its password
      description: >-
        Checks the demo password. On success the response sets the demo access
        cookie (mibolt_demo_access, 30 days). A wrong password receives 401
        UNAUTHENTICATED and no cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoSessionRequest'
      responses:
        '204':
          description: Signed in; the response sets the demo access cookie.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The demo password is wrong. Code UNAUTHENTICATED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/auth/session:
    get:
      operationId: getAdminSession
      tags:
      - AdminAuth
      summary: Read the signed-in admin
      description: >-
        Returns the admin bound to the admin session cookie, or 401 when the
        request carries no valid admin session. Every response also issues the
        XSRF-TOKEN cookie (Path=/), so the admin application calls this once
        before its first POST, the login included.
      security:
      - adminSession: []
      - {}
      responses:
        '200':
          description: The signed-in admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/auth/login:
    post:
      operationId: loginAdmin
      tags:
      - AdminAuth
      summary: Sign in with a username and a password
      description: >-
        Needs the X-XSRF-TOKEN header like every admin POST. On success the
        session identifier changes and the response sets the admin session
        cookie and a fresh XSRF-TOKEN cookie. An unknown username and a wrong
        password receive the same 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/auth/logout:
    post:
      operationId: logoutAdmin
      tags:
      - AdminAuth
      summary: End the admin session
      description: >-
        Idempotent: 204 with or without a live session. Invalidates the
        session, expires the admin session cookie and issues a fresh
        XSRF-TOKEN cookie.
      security:
      - adminSession: []
      - {}
      responses:
        '204':
          description: Signed out.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/auth/password:
    put:
      operationId: changeAdminPassword
      tags:
      - AdminAuth
      summary: Change the signed-in admin's own password
      description: >-
        A wrong current password is 422 with fieldErrors /currentPassword
        WRONG_PASSWORD; a new password over 72 UTF-8 bytes is 422 with
        /newPassword PASSWORD_TOO_LONG. The session stays signed in.
      security:
      - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPasswordChangeRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/users:
    get:
      operationId: listAdminUsers
      tags:
      - AdminUsers
      summary: List every admin
      description: Ordered by createdAt, then username. Not paged.
      security:
      - adminSession: []
      responses:
        '200':
          description: Every admin.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAdminUser
      tags:
      - AdminUsers
      summary: Create an admin with a generated password
      description: >-
        The generated password appears in this response only; the server keeps
        a bcrypt hash and can never show it again.
      security:
      - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateRequest'
      responses:
        '201':
          description: The admin was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The username is taken. Code USERNAME_TAKEN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/users/{adminId}:
    parameters:
    - $ref: '#/components/parameters/AdminId'
    delete:
      operationId: deleteAdminUser
      tags:
      - AdminUsers
      summary: Delete an admin
      description: >-
        The signed-in admin cannot delete themselves (ADMIN_SELF_DELETE) and the
        last admin cannot be deleted (LAST_ADMIN), so the system never locks
        itself out.
      security:
      - adminSession: []
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The admin cannot be deleted. Code ADMIN_SELF_DELETE or LAST_ADMIN.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/products:
    get:
      operationId: listAdminProducts
      tags:
      - AdminProducts
      summary: Page through the catalogue for maintenance
      description: >-
        One entry per product. Sorting is on one whitelisted field with a
        direction, and the product id breaks ties so pages never overlap.
        totalElements counts every matching product, so a virtual-scroll table
        knows its full length. A page beyond the last returns empty items with
        the totals unchanged. Unknown query parameters return 400.
      security:
      - adminSession: []
      parameters:
      - name: q
        in: query
        description: Case-insensitive, NFC-normalised substring over brand, name and
          slug. Trimmed.
        schema:
          type: string
          maxLength: 100
      - name: brand
        in: query
        description: Repeatable exact brand. OR within this filter.
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/AdminProductStatusFilter'
      - name: featured
        in: query
        schema:
          type: boolean
      - name: outOfStock
        in: query
        description: true keeps products whose total stock is zero, false keeps
          products with any stock.
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          $ref: '#/components/schemas/AdminProductSortField'
      - name: direction
        in: query
        schema:
          $ref: '#/components/schemas/SortDirection'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createAdminProduct
      tags:
      - AdminProducts
      summary: Create a product
      description: >-
        The new product is active. Variant ids are generated as
        <slug>--<colorCode>--<storageGb>. Prices and stock are accepted from
        this body because this is the authenticated catalogue-maintenance
        surface.
      security:
      - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductInput'
      responses:
        '201':
          description: The product was created.
          headers:
            ETag:
              $ref: '#/components/headers/ProductETag'
            Location:
              description: The address of the created product.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/products/{productId}:
    parameters:
    - $ref: '#/components/parameters/ProductId'
    get:
      operationId: getAdminProduct
      tags:
      - AdminProducts
      summary: Read one product with every editable member
      description: Archived products are readable. The ETag carries the version.
      security:
      - adminSession: []
      responses:
        '200':
          description: The product.
          headers:
            ETag:
              $ref: '#/components/headers/ProductETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: replaceAdminProduct
      tags:
      - AdminProducts
      summary: Replace every editable member of a product
      description: >-
        If-Match must carry the ETag being edited: missing is 428, stale is
        412. The slug cannot change after creation (422 SLUG_IMMUTABLE).
        Variants are matched by (colorCode, storageGb): a kept pair keeps its
        id, a new pair gets a new id, a dropped pair is deleted unless an
        unexpired cart holds it (409 VARIANT_IN_CART).
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ProductIfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminProductInput'
      responses:
        '200':
          description: The replaced product.
          headers:
            ETag:
              $ref: '#/components/headers/ProductETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A dropped variant is in an unexpired cart (VARIANT_IN_CART,
            params.variantIds), or the change collides with a catalogue uniqueness
            rule (CATALOG_CONSTRAINT_CONFLICT).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/ProductPreconditionFailed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/products/{productId}/archive:
    parameters:
    - $ref: '#/components/parameters/ProductId'
    post:
      operationId: archiveAdminProduct
      tags:
      - AdminProducts
      summary: Archive a product (soft delete)
      description: >-
        The shop stops listing and serving it; a cart line of its variants is
        removed with an ITEM_REMOVED notice on the next cart read. Already
        archived: 200 with the version unchanged.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ProductIfMatch'
      responses:
        '200':
          description: The archived product.
          headers:
            ETag:
              $ref: '#/components/headers/ProductETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/ProductPreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/products/{productId}/restore:
    parameters:
    - $ref: '#/components/parameters/ProductId'
    post:
      operationId: restoreAdminProduct
      tags:
      - AdminProducts
      summary: Restore an archived product
      description: >-
        Already active: 200 with the version unchanged. A featured product
        cannot be restored while four active products are featured
        (409 FEATURED_LIMIT).
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ProductIfMatch'
      responses:
        '200':
          description: The restored product.
          headers:
            ETag:
              $ref: '#/components/headers/ProductETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Four active products are already featured. Code FEATURED_LIMIT.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/ProductPreconditionFailed'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/brands:
    get:
      operationId: listAdminBrands
      tags:
      - AdminProducts
      summary: List every brand in the catalogue
      description: Distinct brands of all products, archived included, in
        case-insensitive order. Feeds the list filter and the edit form.
      security:
      - adminSession: []
      responses:
        '200':
          description: Every brand.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /admin/media:
    post:
      operationId: uploadAdminMedia
      tags:
      - AdminMedia
      summary: Upload a catalogue image
      description: >-
        One part named file. The type is read from the bytes (WebP, JPEG or
        PNG), never from the declared part type. The id is the SHA-256 of the
        bytes, so uploading the same bytes twice returns the stored image with
        200. Unreferenced images are kept.
      security:
      - adminSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: The image was stored.
          headers:
            Location:
              description: The media URL of the stored image.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedImage'
        '200':
          description: These bytes were already stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mibolt_session
      description: >-
        Anonymous session cookie issued by the server on first contact with a
        session-scoped operation. Set with HttpOnly, Secure and SameSite=Lax, and
        with a Max-Age that matches the cart lifetime. It carries no identity and
        grants no privilege beyond access to its own cart, checkout draft and
        orders.
    adminSession:
      type: apiKey
      in: cookie
      name: mibolt_admin_session
      description: >-
        Admin session cookie issued by POST /admin/auth/login and bound to one
        admin. HttpOnly, Secure, SameSite=Strict, Path=/api/v1. The session
        ends after 30 minutes without a request or at POST /admin/auth/logout.
        Mutating admin requests also need the X-XSRF-TOKEN header echoing the
        XSRF-TOKEN cookie.
    demoAccess:
      type: apiKey
      in: cookie
      name: mibolt_demo_access
      description: >-
        Demo access cookie issued by POST /demo/session for the demo password.
        HttpOnly, Secure, SameSite=Lax, Path=/api/v1, Max-Age 30 days. Every
        shop operation except the two /demo/session operations needs it and
        answers 401 UNAUTHENTICATED without a valid one. It carries no identity
        beyond the one demo user.
  headers:
    ETag:
      description: The current session state version, quoted. Send it back in If-Match
        on the next mutation.
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
    ProductETag:
      description: The product version, quoted. Send it back in If-Match on the
        next change of this product.
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
  parameters:
    ProductSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    VariantId:
      name: variantId
      in: path
      required: true
      description: Globally unique variant identifier. A variant is always exactly
        one cart line, so no separate line identifier exists.
      schema:
        type: string
        minLength: 1
    ImageId:
      name: imageId
      in: path
      required: true
      description: Content-addressed media identifier, the same value as Image.id.
      schema:
        type: string
        minLength: 1
    PaymentIntentId:
      name: paymentIntentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The session state version from the most recent ETag, quoted. A
        mismatch returns 412.
      schema:
        type: string
        pattern: ^"[0-9]+"$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Scoped to method, path and session, retained for 24 hours. The same key
        with the same normalised body replays the original result before any
        state check. The same key with a different body returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 100
    AdminId:
      name: adminId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProductIfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        The product ETag this change is based on. Required in practice: a
        request without it is refused with 428 and a stale one with 412. It is
        declared optional so that the server, not the framework, answers the
        missing case.
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    BadRequest:
      description: >-
        The request is malformed: a wrong type, a missing required member or an
        unknown query parameter. Code INVALID_REQUEST.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:mi-bolt:problem:invalid-request
            title: Malformed request
            status: 400
            code: INVALID_REQUEST
            detail: Unknown query parameter "colour".
            traceId: 01JB8X5Q36
            fieldErrors: []
    NotFound:
      description: The addressed resource does not exist, or does not belong to this
        session. Code NOT_FOUND.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with current state. See Problem.code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: The cart expired. Code CART_EXPIRED.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: >-
        The If-Match version does not match the current session state, so another
        change landed first. Code CART_VERSION_CONFLICT. Re-read the cart or the
        checkout draft and retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: urn:mi-bolt:problem:version-conflict
            title: Version conflict
            status: 412
            code: CART_VERSION_CONFLICT
            detail: The session state changed since the version supplied in If-Match.
            traceId: 01JB8X5Q37
            fieldErrors: []
    ServiceUnavailable:
      description: The service is temporarily unavailable. Code SERVICE_UNAVAILABLE.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid admin session. Code UNAUTHENTICATED.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DemoAccessRequired:
      description: >-
        No valid demo access cookie. Code UNAUTHENTICATED. The storefront sends
        the visitor to its demo sign-in page.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The X-XSRF-TOKEN header is missing or does not match the
        XSRF-TOKEN cookie. Code CSRF_TOKEN_INVALID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: One or more members are not acceptable. Code VALIDATION_FAILED;
        fieldErrors carries a JSON pointer and a code per member.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ProductPreconditionFailed:
      description: The If-Match version is not the product's current version.
        Code PRODUCT_VERSION_CONFLICT with params.expected and params.received.
        Re-read the product and reapply the change.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: The request has no If-Match header. Code PRECONDITION_REQUIRED.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: The upload exceeds the size limit. Code PAYLOAD_TOO_LARGE with
        params.maxBytes.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AdminPromotionInput:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 300
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    Promotion:
      type: object
      additionalProperties: false
      required: [active, serverNow]
      properties:
        text:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        active:
          type: boolean
        serverNow:
          type: string
          format: date-time
    AdminPromotion:
      type: object
      additionalProperties: false
      required: [active, serverNow, version]
      properties:
        text:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        active:
          type: boolean
        serverNow:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
    Money:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 100000000
          description: Whole Hungarian forints, not ISO minor units.
        currency:
          type: string
          enum:
          - HUF
    StorageGb:
      type: integer
      enum:
      - 128
      - 256
      - 512
    Availability:
      type: string
      enum:
      - in_stock
      - out_of_stock
    ProductSort:
      type: string
      enum:
      - recommended
      - newest
      - oldest
      - popularity
      - price_asc
      - price_desc
      - name_asc
      - name_desc
      default: recommended
    Image:
      type: object
      additionalProperties: false
      required:
      - id
      - src
      - alt
      - width
      - height
      properties:
        id:
          type: string
          description: Content-addressed media identifier. Addressable at /media/{imageId}.
        src:
          type: string
          description: >-
            A ready-to-use URL for this image. The client puts it into the markup
            unchanged and never prefixes or rewrites it. It may be root-relative
            (for example /api/v1/media/<id>) or absolute (a content delivery
            network), and which one it is is the server's decision. Moving image
            delivery elsewhere therefore changes stored values, not this contract.
        alt:
          type: string
          minLength: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    ColorOption:
      type: object
      additionalProperties: false
      description: One colour of the same product at the same storage size. Selecting
        it changes the price, the image and the link target.
      required:
      - colorCode
      - colorName
      - swatchHex
      - variantId
      - variantSlug
      - price
      - availability
      properties:
        colorCode:
          type: string
        colorName:
          type: string
        swatchHex:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        variantId:
          type: string
        variantSlug:
          type: string
        originalPrice:
          $ref: '#/components/schemas/Money'
        promotion:
          $ref: '#/components/schemas/Promotion'
        image:
          $ref: '#/components/schemas/Image'
        price:
          $ref: '#/components/schemas/Money'
        availability:
          $ref: '#/components/schemas/Availability'
    Variant:
      type: object
      additionalProperties: false
      required:
      - id
      - slug
      - colorCode
      - colorName
      - swatchHex
      - storageGb
      - price
      - availability
      - maxQuantity
      - images
      properties:
        id:
          type: string
        slug:
          type: string
          description: Unique inside one product, used as the route segment after
            the product slug.
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        colorCode:
          type: string
        colorName:
          type: string
        swatchHex:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        storageGb:
          $ref: '#/components/schemas/StorageGb'
        originalPrice:
          $ref: '#/components/schemas/Money'
        promotion:
          $ref: '#/components/schemas/Promotion'
        price:
          $ref: '#/components/schemas/Money'
        availability:
          $ref: '#/components/schemas/Availability'
        maxQuantity:
          type: integer
          minimum: 0
          maximum: 10
          description: Effective per-line cap for this variant. Zero means it cannot
            be ordered, which is consistent with availability out_of_stock.
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          minItems: 1
    SpecRow:
      type: object
      additionalProperties: false
      required:
      - label
      - value
      properties:
        label:
          type: string
        value:
          type: string
    SpecGroup:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - rows
      properties:
        id:
          type: string
        title:
          type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SpecRow'
          minItems: 1
    ProductBase:
      type: object
      description: Members shared by a catalogue entry and a full product.
      required:
      - id
      - slug
      - brand
      - name
      - highlights
      - is5g
      - releasedAt
      properties:
        id:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        brand:
          type: string
        name:
          type: string
        highlights:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 6
          description: One-line selling points. The card shows the first two, the
            detail page shows all of them.
        is5g:
          type: boolean
        releasedAt:
          type: string
          format: date
    CatalogItem:
      description: >-
        One list entry: a product at one storage size. Carries a concrete price,
        so no "from" pricing is needed, and the colours array drives the colour
        switch inside the card.
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/ProductBase'
      - type: object
        required:
        - storageGb
        - variantId
        - variantSlug
        - price
        - availability
        - maxQuantity
        - image
        - colors
        properties:
          storageGb:
            $ref: '#/components/schemas/StorageGb'
          variantId:
            type: string
          variantSlug:
            type: string
          originalPrice:
            $ref: '#/components/schemas/Money'
          promotion:
            $ref: '#/components/schemas/Promotion'
          price:
            $ref: '#/components/schemas/Money'
          availability:
            $ref: '#/components/schemas/Availability'
          maxQuantity:
            type: integer
            minimum: 0
            maximum: 10
          image:
            $ref: '#/components/schemas/Image'
          colors:
            type: array
            items:
              $ref: '#/components/schemas/ColorOption'
            minItems: 1
    Product:
      description: A product with every colour and storage combination.
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/ProductBase'
      - type: object
        required:
        - description
        - variants
        - specGroups
        properties:
          description:
            type: string
          variants:
            type: array
            items:
              $ref: '#/components/schemas/Variant'
            minItems: 1
          specGroups:
            type: array
            items:
              $ref: '#/components/schemas/SpecGroup'
            minItems: 1
    FacetValue:
      type: object
      required:
      - value
      - label
      - count
      properties:
        value:
          type: string
        label:
          type: string
        count:
          type: integer
          minimum: 0
    ColorFacetValue:
      unevaluatedProperties: false
      allOf:
      - $ref: '#/components/schemas/FacetValue'
      - type: object
        required:
        - swatchHex
        properties:
          swatchHex:
            type: string
            pattern: ^#[0-9A-Fa-f]{6}$
    PriceRange:
      type: object
      additionalProperties: false
      description: Bounds of the current result set, for the price slider.
      required:
      - min
      - max
      properties:
        min:
          $ref: '#/components/schemas/Money'
        max:
          $ref: '#/components/schemas/Money'
    Facets:
      type: object
      additionalProperties: false
      description: >-
        Disjunctive counts: each facet is counted with its own selection removed,
        so a shopper can always see what a different choice would yield. Every
        filter has a count, so zero-result options can be disabled rather than
        offered.
      required:
      - brands
      - storageGb
      - colors
      - is5g
      - inStock
      - priceRange
      properties:
        brands:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        storageGb:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        colors:
          type: array
          items:
            $ref: '#/components/schemas/ColorFacetValue'
        is5g:
          type: integer
          minimum: 0
          description: Entries that would remain if the 5G filter were switched on.
        inStock:
          type: integer
          minimum: 0
          description: Entries that would remain if the in-stock filter were switched
            on.
        priceRange:
          $ref: '#/components/schemas/PriceRange'
    ProductPage:
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - page
      - pageSize
      - totalPages
      - facets
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogItem'
        total:
          type: integer
          minimum: 0
          description: Number of list entries, that is (product, storage) pairs.
        page:
          type: integer
          minimum: 1
          description: Echoes the requested page, even when it is beyond the last
            one.
        pageSize:
          type: integer
          enum:
          - 12
          - 24
        totalPages:
          type: integer
          minimum: 0
        facets:
          $ref: '#/components/schemas/Facets'
    ProblemCode:
      type: string
      enum:
      - INVALID_REQUEST
      - VALIDATION_FAILED
      - NOT_FOUND
      - CART_EXPIRED
      - CART_VERSION_CONFLICT
      - OUT_OF_STOCK
      - QUANTITY_LIMIT
      - PRICE_CHANGED
      - CHECKOUT_INCOMPLETE
      - PAYMENT_DECLINED
      - PAYMENT_PENDING
      - PAYMENT_REQUIRED
      - PAYMENT_ALREADY_RESOLVED
      - IDEMPOTENCY_CONFLICT
      - SERVICE_UNAVAILABLE
      - UNAUTHENTICATED
      - CSRF_TOKEN_INVALID
      - PRODUCT_VERSION_CONFLICT
      - PRECONDITION_REQUIRED
      - USERNAME_TAKEN
      - ADMIN_SELF_DELETE
      - LAST_ADMIN
      - VARIANT_IN_CART
      - FEATURED_LIMIT
      - CATALOG_CONSTRAINT_CONFLICT
      - PAYLOAD_TOO_LARGE
    FieldError:
      type: object
      additionalProperties: false
      required:
      - path
      - code
      properties:
        path:
          type: string
          description: JSON pointer into the request body, for example /contact/phone.
        code:
          type: string
          description: Machine-readable reason. The user interface supplies the wording.
        params:
          type: object
          additionalProperties: true
          description: Values to interpolate into the message, for example a maximum.
    Problem:
      type: object
      additionalProperties: false
      description: >-
        Problem details. title and detail are English developer diagnostics and
        are never shown to shoppers; the user interface composes its text from
        code, params and fieldErrors.
      required:
      - type
      - title
      - status
      - code
      - detail
      - traceId
      - fieldErrors
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: '#/components/schemas/ProblemCode'
        detail:
          type: string
        traceId:
          type: string
        params:
          type: object
          additionalProperties: true
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    CartNoticeCode:
      type: string
      enum:
      - QUANTITY_REDUCED
      - PRICE_CHANGED
      - ITEM_REMOVED
    CartNotice:
      type: object
      additionalProperties: false
      description: >-
        A change the server made on its own, not something the shopper asked for.
        Rejected requests return an error instead. These drive the banners at the
        top of the cart page.
      required:
      - code
      properties:
        code:
          $ref: '#/components/schemas/CartNoticeCode'
        variantId:
          type: string
        productName:
          type: string
          description: >-
            The name of the product the notice is about, as its cart line shows it,
            so the banner can name the product even after an ITEM_REMOVED notice
            has taken its line out of the cart.
        params:
          $ref: '#/components/schemas/CartNoticeParams'
    CartNoticeParams:
      type: object
      additionalProperties: false
      description: >-
        What changed, by notice code. ITEM_REMOVED carries quantity, the quantity
        the removed line held. QUANTITY_REDUCED carries from and to, the line's
        old and new quantity. PRICE_CHANGED carries from and to, the old and the
        new unit price in whole Hungarian forints.
      properties:
        quantity:
          type: integer
          minimum: 1
        from:
          type: integer
          minimum: 0
        to:
          type: integer
          minimum: 0
    CartItem:
      type: object
      additionalProperties: false
      required:
      - variantId
      - variantSlug
      - productId
      - productSlug
      - productName
      - colorName
      - storageGb
      - image
      - quantity
      - unitPrice
      - lineTotal
      - availability
      - maxQuantity
      properties:
        variantId:
          type: string
        variantSlug:
          type: string
        productId:
          type: string
        productSlug:
          type: string
        productName:
          type: string
        colorName:
          type: string
        storageGb:
          $ref: '#/components/schemas/StorageGb'
        image:
          $ref: '#/components/schemas/Image'
        quantity:
          type: integer
          minimum: 1
          maximum: 10
        unitPrice:
          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
        availability:
          $ref: '#/components/schemas/Availability'
        maxQuantity:
          type: integer
          minimum: 0
          maximum: 10
          description: Effective cap for this line. quantity never exceeds it; if
            stock drops below it, the server reduces quantity and reports a notice.
    Cart:
      type: object
      additionalProperties: false
      required:
      - id
      - version
      - items
      - lineCount
      - totalQuantity
      - subtotal
      - expiresAt
      - notices
      properties:
        basketRevision:
          type: integer
          format: int64
        id:
          type: string
          description: Internal reference. It never appears in a path; the session
            identifies the cart.
        version:
          type: integer
          minimum: 1
          description: Session state version, shared with the checkout draft and mirrored
            by the ETag.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        lineCount:
          type: integer
          minimum: 0
        totalQuantity:
          type: integer
          minimum: 0
          description: Sum of line quantities. This is the number shown on the header
            badge.
        subtotal:
          $ref: '#/components/schemas/Money'
        expiresAt:
          type: string
          format: date-time
          description: Every successful operation pushes this forward, so an active
            shopper never loses the cart.
        notices:
          type: array
          items:
            $ref: '#/components/schemas/CartNotice'
    AddCartItemRequest:
      type: object
      additionalProperties: false
      required:
      - variantId
      - quantity
      properties:
        variantId:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 10
    SetCartItemQuantityRequest:
      type: object
      additionalProperties: false
      required:
      - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          description: Absolute quantity, never a delta.
    Contact:
      type: object
      additionalProperties: false
      required:
      - fullName
      - email
      - phone
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          pattern: ^\+36[0-9]{8,9}$
    Address:
      type: object
      additionalProperties: false
      required:
      - countryCode
      - postalCode
      - city
      - line1
      properties:
        countryCode:
          type: string
          enum:
          - HU
        postalCode:
          type: string
          pattern: ^[1-9][0-9]{3}$
        city:
          type: string
          minLength: 2
          maxLength: 80
        line1:
          type: string
          minLength: 3
          maxLength: 120
        line2:
          type: string
          maxLength: 120
    BillingDetails:
      type: object

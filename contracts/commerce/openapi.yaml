          $ref: '#/components/schemas/PaymentMethodId'
        label:
          type: string
        description:
          type: string
        fee:
          $ref: '#/components/schemas/Money'
          description: Surcharge for this method, zero when there is none.
        available:
          type: boolean
        unavailableReason:
          $ref: '#/components/schemas/UnavailableReason'
    CheckoutOptions:
      type: object
      additionalProperties: false
      required:
      - deliveryOptions

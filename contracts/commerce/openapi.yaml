          $ref: '#/components/schemas/Address'
    PickupPointSelection:
      type: object
      additionalProperties: false
      required:
      - optionId
      properties:
        optionId:
          type: string
          enum:
          - pickup_point
    DeliverySelection:
      description: Home delivery carries an address; pickup has no address member
        at all.
      oneOf:
      - $ref: '#/components/schemas/HomeDeliverySelection'
      - $ref: '#/components/schemas/PickupPointSelection'
      discriminator:
        propertyName: optionId
        mapping:
          home_delivery: '#/components/schemas/HomeDeliverySelection'
          pickup_point: '#/components/schemas/PickupPointSelection'
    PaymentSelection:
      type: object
      additionalProperties: false
      required:
      - method
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethodId'
    CheckoutSummary:
      type: object
      additionalProperties: false
      description: Recomputed on every read, so it is always current.
      required:
      - subtotal
      - shippingFee
      - paymentFee
      - total
      properties:
        subtotal:
          $ref: '#/components/schemas/Money'
        shippingFee:
          $ref: '#/components/schemas/Money'
        paymentFee:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
    CheckoutSession:
      type: object
      additionalProperties: false
      description: >-
        The persistent checkout draft. Sections are optional until the order is
        placed. The draft is cleared when the order succeeds.
      required:
      - version
      - summary
      - complete
      properties:
        basketRevision:
          type: integer
          format: int64
        priceChanged:
          type: boolean
        version:
          type: integer
          minimum: 1
          description: Session state version, shared with the cart.
        contact:
          $ref: '#/components/schemas/Contact'
        billing:
          $ref: '#/components/schemas/BillingDetails'
        delivery:
          $ref: '#/components/schemas/DeliverySelection'
        payment:
          $ref: '#/components/schemas/PaymentSelection'
        summary:
          $ref: '#/components/schemas/CheckoutSummary'
        complete:
          type: boolean
          description: True when every required section is present and the cart is
            not empty.
    UpdateCheckoutRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Only the supplied sections are written; absent sections are retained.
      properties:
        acceptedPriceVersion:
          type: integer
          format: int64
          description: Explicitly accept the currently displayed price change; must equal the current session version.
        contact:
          $ref: '#/components/schemas/Contact'
        billing:
          $ref: '#/components/schemas/BillingDetails'
        delivery:
          $ref: '#/components/schemas/DeliverySelection'
        payment:
          $ref: '#/components/schemas/PaymentSelection'
    PaymentIntentStatus:
      type: string
      enum:
      - requires_action
      - succeeded
      - declined
      - pending
    PaymentIntent:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - amount
      - redirectUrl
      - returnUrl
      - createdAt
      - expiresAt
      properties:
        basketRevision:
          type: integer
          format: int64
        id:
          type: string
        status:
          $ref: '#/components/schemas/PaymentIntentStatus'
        amount:
          $ref: '#/components/schemas/Money'
        redirectUrl:
          type: string
          format: uri-reference
          description: Where the shopper is sent to authorise the payment.
        returnUrl:
          type: string
          format: uri-reference
          description: Where the payment page sends the shopper back to.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: A pending intent reaches a terminal status before this moment.
    PaymentOutcomeRequest:
      type: object
      additionalProperties: false
      description: The outcome the shopper chose on the demo payment page.
      required:
      - outcome
      properties:
        outcome:
          type: string
          enum:
          - succeeded
          - declined
          - pending
    CardOrderRequest:
      type: object
      additionalProperties: false
      required:
      - paymentMethod

#:schema https://developers.openai.com/codex/config-schema.json

[mcp_servers.angular-cli]
command = "sh"
args = [
  "-c",
  'cd "$(git rev-parse --show-toplevel)/frontend" && exec npx -y @angular/cli mcp',
]

[mcp_servers.chrome-devtools]
command = "npx"
args = [
  "-y",
  "chrome-devtools-mcp@latest",
  "--isolated",
  "--headless",
  "--experimental-screencast",
]

[mcp_servers.playwright-test]
command = "sh"
args = [
  "-c",
  'cd "$(git rev-parse --show-toplevel)/frontend" && exec npx playwright run-test-mcp-server -c playwright.config.ts',
]

[mcp_servers.spring-tools]
command = "sh"
args = [
  "-c",
  'repo_root="$(git rev-parse --show-toplevel)" && exec java -Xmx1024m -Djdk.util.zip.disableZip64ExtraFieldValidation=true -Dspring.config.location=classpath:/application.properties -Dspring.profiles.active=file-logging "-Dlogging.file.name=${repo_root}/.spring-tools/boot-ls.log" -Dlogging.level.root=INFO -Dspring.ai.mcp.server.stdio=true -Dlanguageserver.enabled=false "-Dspring.boot.ls.project.dir=${repo_root}/backend" -jar "${repo_root}/.spring-tools/spring-boot-language-server-standalone-exec.jar"',
]

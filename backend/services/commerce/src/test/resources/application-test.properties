# H2 in PostgreSQL mode (https://h2database.com/html/features.html). The same Liquibase
# changelog runs on it as on the production Postgres container; Hibernate's validate
# step then confirms the JPA mappings agree.
spring.datasource.url=jdbc:h2:mem:mibolt;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# T4: catalogue loader reads from the fixture directory under src/test/resources.
mibolt.catalog.path=src/test/resources/catalog

# Hibernate statistics gate query-count assertions (see CatalogQueryCountTest).
spring.jpa.properties.hibernate.generate_statistics=true

# MIM-251: pin the payment URL prefixes so the API tests do not depend on the
# developer's environment.
mibolt.payment.redirect-url-prefix=http://localhost:4210/demo-fizetes/
mibolt.payment.return-url-prefix=http://localhost:4200/penztar?paymentIntentId=

# MIM-325: the integration suite signs in as the bootstrapped admin with this password
# (26 characters, inside the admin password policy).
mibolt.admin.initial-password=integration-admin-password

# MIM-423: pin the demo credentials, for the reason MIM-251 and MIM-325 pin theirs. The
# demo API tests sign in with this password, and MIBOLT_DEMO_USERNAME / MIBOLT_DEMO_PASSWORD
# exported in the developer's shell would otherwise reach the bootstrapped demo user.
mibolt.demo.username=MiBoltDemoUser
mibolt.demo.password=1MiBoltDemo1

spring.application.name=mi-bolt-backend

# Datasource — values come from environment variables with the local dev defaults from
# docs/04-adatbazis.md §2. The password default is a documented throwaway, not a secret.
spring.datasource.url=${MIBOLT_DB_URL:jdbc:postgresql://localhost:55433/mi_bolt}
spring.datasource.username=${MIBOLT_DB_USER:mi_bolt}
spring.datasource.password=${MIBOLT_DB_PASSWORD:mi_bolt_local}

# Schema is owned by Liquibase (docs/04-adatbazis.md §3). Hibernate validates only.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JSON: omit absent optional members instead of serialising them as null, and
# refuse a request body with a member the contract does not declare (every
# request schema is additionalProperties: false); ProblemAdvice maps the
# resulting HttpMessageNotReadableException to 400 INVALID_REQUEST. The
# catalogue loader's DTOs opt out with @JsonIgnoreProperties(ignoreUnknown).
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=true

# Contract server URL is /api/v1 (contracts/commerce/kommunikacio.md §1). Spring's context-path
# routes the generated @RequestMapping paths (relative) under that prefix.
server.servlet.context-path=/api/v1

# Admin session cookie (docs/decisions/0015). Only the admin filter chain creates an
# HTTP session; the shop keeps its own mibolt_session cookie and stays stateless.
server.servlet.session.cookie.name=mibolt_admin_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# First admin (docs/decisions/0016): created at startup when admin_user is empty. Blank means a
# generated password printed once at WARN; set MIBOLT_ADMIN_INITIAL_PASSWORD for CI and docker runs.
mibolt.admin.initial-password=${MIBOLT_ADMIN_INITIAL_PASSWORD:}

# Session lifetime matches the cart and checkout draft lifetime (contracts/commerce/kommunikacio.md §2): 30 days.
mibolt.session.lifetime=30d

# Checkout fees and thresholds (docs/02-backend.md §4.3 rule 29 leaves the numbers to the
# implementation; these are the demo defaults recorded in docs/decisions/0010). Whole HUF.
mibolt.checkout.home-delivery-fee-huf=1490
mibolt.checkout.pickup-fee-huf=990
mibolt.checkout.free-shipping-threshold-huf=30000
mibolt.checkout.card-fee-huf=0
mibolt.checkout.cash-on-delivery-fee-huf=490
mibolt.checkout.cash-on-delivery-max-cart-huf=300000
mibolt.checkout.terms-version=2026-09

# Payment intents and orders (docs/02-backend.md §4.4–4.5; demo defaults recorded in
# docs/decisions/0012). The demo payment app lives on its own origin (MIM-251), so
# both prefixes are absolute; override them where the shop or the gateway runs elsewhere.
mibolt.payment.intent-lifetime=30m
mibolt.payment.redirect-url-prefix=${MIBOLT_PAYMENT_REDIRECT_URL_PREFIX:http://localhost:4210/demo-fizetes/}
mibolt.payment.return-url-prefix=${MIBOLT_PAYMENT_RETURN_URL_PREFIX:http://localhost:4200/penztar?paymentIntentId=}
mibolt.idempotency.retention=24h

# The order-receipt notice is a Java constant in OrderService (the ISO-8859-1
# default for .properties turns Hungarian UTF-8 into Latin-1 mojibake).

# Readiness probe for the Compose health check: UP only after the ApplicationRunners
# (CatalogLoader, AdminBootstrap) have run, at /api/v1/actuator/health/readiness.
management.endpoint.health.probes.enabled=true

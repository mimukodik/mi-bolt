databaseChangeLog:
  - changeSet:
      id: 0007-admin-user
      author: mi-bolt
      comment: |
        Admin accounts for the /admin API (docs/decisions/0016). The id is a
        UUID generated by Hibernate (GenerationType.UUID), so the first admin's
        id is never 1; Liquibase's uuid type is native UUID on H2 and on
        PostgreSQL. password_hash holds the DelegatingPasswordEncoder output
        ({bcrypt} prefix plus the 60-character bcrypt string).
      changes:
        - createTable:
            tableName: admin_user
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: varchar(80)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: admin_user
            columnNames: username
            constraintName: uq_admin_user_username
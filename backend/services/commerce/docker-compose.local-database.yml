name: mi-bolt-local

services:

  postgres:
    image: postgres:16.15-alpine3.24
    container_name: mi-bolt-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"

    command: ["postgres", "-c", "max_connections=250"]
    ports:
      - "55433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

    networks:
      - mi-bolt



volumes:

  # Deliberately a Docker named volume for PostgreSQL.
  # Use pg_dump/pg_restore commands for migration.
  postgres-data:
    name: mi-bolt-postgres-data


networks:
  mi-bolt:
    name: mi-bolt-local
    driver: bridge

<app-navigation-reason-banner />

@switch (state().kind) {
  @case ('loading') {
    <div class="loading" data-testid="delivery-loading">
      <app-loading-state label="Szállítási és fizetési opciók betöltése" variant="lines" />
    </div>
  }
  @case ('error') {
    <app-error-state
      retryLabel="Újrapróbálom"
      title="Az opciók nem érhetők el"
      [message]="errorMessage()"
      [pending]="retrying()"
      (retryRequested)="onRetry()"
    />
  }
  @case ('ready') {
    @if (saveFailure(); as failure) {
      <app-status-message
        data-testid="delivery-save-failure-detail"
        severity="error"
        [message]="saveFailureMessage()"
        [persistent]="true"
      />
    }
    @if (readyOptions(); as options) {
      <app-delivery-step
        [fields]="fields"
        [options]="options"
        [saveState]="saveState()"
        (continueRequested)="onContinueRequested()"
        (retryOptions)="onRetryOptions()"
      />
    }
  }
}

<fieldset
  class="payment m-0 p-(--space-5) sm:p-(--space-6) bg-(--color-surface-light) border border-(--color-border-subtle) rounded-(--radius-card) text-(color:--color-text-primary)"
  data-testid="payment-selector"
  [attr.aria-describedby]="describedBy()"
>
  <legend
    class="legend px-(--space-2) text-(length:--type-card-title) [font-weight:var(--weight-bold)] leading-(--line-height-heading)"
  >
    Fizetési mód
  </legend>

  <ul class="options m-0 mt-(--space-3) p-0 list-none flex flex-col gap-(--space-3)" role="list">
    @for (option of options(); track option.id) {
      <li
        class="option rounded-(--radius-card) border transition-colors"
        data-testid="payment-option"
        [class.is-active]="isSelected(option.id)"
        [class.is-unavailable]="!option.available"
      >
        <label
          class="option-label flex items-start gap-(--space-3) p-(--space-4)"
          [attr.for]="optionId(option.id)"
          [class.cursor-pointer]="option.available"
        >
          <input
            class="radio w-5 h-5 mt-1 accent-(--color-brand-ink)"
            data-testid="payment-radio"
            name="paymentMethod"
            type="radio"
            [attr.aria-checked]="isSelected(option.id) ? 'true' : 'false'"
            [attr.aria-describedby]="helperId(option.id)"
            [checked]="isSelected(option.id)"
            [disabled]="!option.available"
            [id]="optionId(option.id)"
            [value]="option.id"
            (change)="onSelected(option.id)"
          />
          <span class="option-body flex flex-col gap-(--space-1) min-w-0">
            <span class="option-row inline-flex items-baseline gap-(--space-2) flex-wrap">
              <span class="option-title [font-weight:var(--weight-medium)]">{{
                option.label
              }}</span>
              <app-price-block label="Fizetési díj" status="success" [money]="option.fee" />
            </span>
            <span
              class="option-helper leading-(--line-height-body) text-(length:--type-helper) text-(color:--color-text-secondary)"
              [id]="helperId(option.id)"
              >{{ option.description }}</span
            >
            @if (!option.available) {
              <span
                class="option-unavailable text-(length:--type-helper) text-(color:--color-status-error)"
                data-testid="payment-unavailable-reason"
              >
                {{ unavailableSentence(option.unavailableReason) }}
              </span>
            }
            @if (isSelected(option.id)) {
              <span
                aria-live="polite"
                class="option-badge mt-(--space-1) inline-flex items-center self-start px-(--space-2) py-(--space-1) rounded-full [font-weight:var(--weight-bold)]"
                data-testid="payment-selected-badge"
              >
                Kiválasztva
              </span>
            }
          </span>
        </label>
      </li>
    }
  </ul>
  <ng-content />
</fieldset>

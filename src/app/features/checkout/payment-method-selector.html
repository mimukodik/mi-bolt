<fieldset class="payment m-0 p-5 rounded" data-testid="payment-selector">
  <legend class="legend px-2 font-bold">Fizetési mód</legend>
  <p class="hint my-2 mb-4 leading-relaxed" data-testid="payment-demo-notice">
    Csak demó fizetési módok érhetők el; nincs valódi kártyaadat vagy átirányítás.
  </p>

  <ul
    class="options m-0 p-0 list-none flex flex-col gap-3"
    role="radiogroup"
    aria-label="Fizetési mód"
  >
    @for (option of options; track option.id) {
      <li
        class="option border rounded transition-colors"
        [class.is-active]="isSelected(option.id)"
        data-testid="payment-option"
      >
        <label
          class="option-label flex items-start gap-3 p-4 cursor-pointer min-h-10"
          [attr.for]="optionId(option.id)"
        >
          <input
            type="radio"
            class="radio w-5 h-5 mt-1"
            [id]="optionId(option.id)"
            name="paymentMethod"
            [value]="option.id"
            [checked]="isSelected(option.id)"
            [attr.aria-checked]="isSelected(option.id) ? 'true' : 'false'"
            [attr.aria-describedby]="helperId(option.id)"
            (change)="onSelected(option.id)"
            data-testid="payment-radio"
          />
          <span class="option-body flex flex-col gap-1 min-w-0">
            <span class="option-row inline-flex items-baseline gap-2">
              <span class="option-title font-medium">{{ option.label }}</span>
              <span
                class="option-tag inline-flex items-center px-2 rounded-full font-bold uppercase tracking-wider"
                aria-hidden="true"
                >{{ option.demoTag }}</span
              >
            </span>
            <span class="option-helper leading-relaxed" [id]="helperId(option.id)">{{
              option.helper
            }}</span>
            @if (isSelected(option.id)) {
              <span
                class="option-badge mt-1 inline-flex items-center px-2 py-1 rounded-full font-bold"
                aria-live="polite"
                data-testid="payment-selected-badge"
              >
                Kiválasztva
              </span>
            }
          </span>
        </label>
      </li>
    }
  </ul>
</fieldset>

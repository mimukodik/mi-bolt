@if (cartFacade.cart(); as cart) {
  @if (checkoutFacade.session(); as session) {
    <app-review-step
      [cart]="cart"
      [draft]="session"
      [quote]="quoteController.quote()"
      [state]="reviewState()"
      (editRequested)="onEditRequested()"
      (refreshQuote)="onRefreshQuote()"
      (submitRequested)="onSubmitRequested()"
    />

    @if (paymentStatus() !== 'idle' && paymentStatus() !== 'error') {
      <!-- OrderSubmission's polling/decline/unknown outcomes render
           through PaymentProgress (components.md:626), which owns
           the retry / change-method controls for those states. This
           block sits below `<app-review-step>` rather than inside its
           own column now that the child's declared input list has no
           room for the signal this container drives it from
           (FIX-63). -->
      <app-payment-progress
        [pollCount]="pollCount()"
        [status]="paymentStatus()"
        (changeMethodRequested)="onPaymentChangeMethod()"
        (retryRequested)="onPaymentRetry()"
      />
    }
    @if (submitFailure(); as failure) {
      @if (failure.kind === 'error') {
        <div class="submit-failure" data-testid="review-submit-failure">
          <app-status-message
            severity="error"
            [message]="submitFailureMessage()"
            [persistent]="true"
          />
          <app-button
            data-testid="review-change-payment"
            label="Fizetési mód módosítása"
            variant="secondary"
            (pressed)="onPaymentChangeMethod()"
          />
        </div>
      }
    }
  } @else {
    <div class="loading" data-testid="review-loading">
      <app-loading-state label="Rendelés adatainak betöltése" variant="lines" />
    </div>
  }
} @else {
  <div class="loading" data-testid="review-loading">
    <app-loading-state label="Kosár betöltése" variant="lines" />
  </div>
}

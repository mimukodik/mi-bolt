<fieldset class="address m-0 p-5 rounded" data-testid="address-form">
  @if (legend(); as legendText) {
    <legend class="legend px-2 font-bold">{{ legendText }}</legend>
  }

  <div class="grid mt-3 grid-cols-1 gap-4">
    <label class="field flex flex-col gap-2 min-w-0" data-testid="address-field-postalCode">
      <span class="label">Irányítószám</span>
      <input
        autocomplete="postal-code"
        class="input w-full min-h-10 px-3 rounded font-inherit"
        data-testid="address-input-postalCode"
        inputmode="numeric"
        type="text"
        [attr.aria-describedby]="describedBy('postalCode')"
        [attr.aria-invalid]="showsInvalid('postalCode') ? 'true' : 'false'"
        [value]="postalCode()"
        (blur)="markTouched('postalCode')"
        (input)="onInput('postalCode', $event)"
      />
      <app-form-field-message
        helpText="Négyjegyű, 1-es vagy 9-es kezdettel."
        [errors]="errors('postalCode')"
        [fieldId]="fieldId('postalCode')"
        [submitted]="submitted()"
        [touched]="isTouched('postalCode')"
      />
    </label>

    <label class="field flex flex-col gap-2 min-w-0" data-testid="address-field-city">
      <span class="label">Város</span>
      <input
        autocomplete="address-level2"
        class="input w-full min-h-10 px-3 rounded font-inherit"
        data-testid="address-input-city"
        type="text"
        [attr.aria-describedby]="describedBy('city')"
        [attr.aria-invalid]="showsInvalid('city') ? 'true' : 'false'"
        [value]="city()"
        (blur)="markTouched('city')"
        (input)="onInput('city', $event)"
      />
      <app-form-field-message
        [errors]="errors('city')"
        [fieldId]="fieldId('city')"
        [submitted]="submitted()"
        [touched]="isTouched('city')"
      />
    </label>

    <label class="field flex flex-col gap-2 min-w-0" data-testid="address-field-line1">
      <span class="label">Cím (utca, házszám)</span>
      <input
        autocomplete="address-line1"
        class="input w-full min-h-10 px-3 rounded font-inherit"
        data-testid="address-input-line1"
        type="text"
        [attr.aria-describedby]="describedBy('line1')"
        [attr.aria-invalid]="showsInvalid('line1') ? 'true' : 'false'"
        [value]="line1()"
        (blur)="markTouched('line1')"
        (input)="onInput('line1', $event)"
      />
      <app-form-field-message
        [errors]="errors('line1')"
        [fieldId]="fieldId('line1')"
        [submitted]="submitted()"
        [touched]="isTouched('line1')"
      />
    </label>

    <label class="field flex flex-col gap-2 min-w-0" data-testid="address-field-line2">
      <span class="label">Emelet, ajtó (opcionális)</span>
      <input
        autocomplete="address-line2"
        class="input w-full min-h-10 px-3 rounded font-inherit"
        data-testid="address-input-line2"
        type="text"
        [attr.aria-describedby]="describedBy('line2')"
        [attr.aria-invalid]="showsInvalid('line2') ? 'true' : 'false'"
        [value]="line2()"
        (blur)="markTouched('line2')"
        (input)="onInput('line2', $event)"
      />
      <app-form-field-message
        helpText="Legfeljebb 120 karakter."
        [errors]="errors('line2')"
        [fieldId]="fieldId('line2')"
        [submitted]="submitted()"
        [touched]="isTouched('line2')"
      />
    </label>

    <div class="field flex flex-col gap-2 min-w-0" data-testid="address-field-country">
      <span class="label">Ország</span>
      <p
        aria-readonly="true"
        class="country m-0 inline-flex items-baseline gap-2 min-h-10 px-3 rounded"
      >
        <span class="country-code font-bold">{{ countryCode }}</span>
        <span class="country-label">{{ countryLabel }}</span>
      </p>
    </div>
  </div>
</fieldset>

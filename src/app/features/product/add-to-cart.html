<div class="root" data-testid="add-to-cart" [attr.aria-busy]="pending() ? 'true' : null">
  <app-button
    data-testid="add-to-cart-button"
    label="Kosárba teszem"
    loadingLabel="Hozzáadás…"
    variant="secondaryOnDark"
    [disabled]="disabled()"
    [loading]="pending()"
    (pressed)="onAdd()"
  />

  @if (statusBanner(); as banner) {
    <div class="status">
      <app-status-message
        [message]="banner.text"
        [persistent]="banner.severity === 'info'"
        [severity]="severity()"
        (dismissed)="onErrorDismissed()"
      />
    </div>
  }
</div>

<aside aria-label="Kosárba helyezés" class="rail" data-testid="purchase-rail">
  <div class="rail-price">
    <app-price-block label="Készülékár" [money]="money()" [status]="priceStatus()" />
  </div>
  <div class="rail-cta">
    <app-button
      data-testid="purchase-cta"
      label="Kosárba teszem"
      loadingLabel="Hozzáadás…"
      variant="primary"
      [disabled]="!available() || pending()"
      [loading]="pending()"
      (pressed)="onPress()"
    />
  </div>
  @if (error(); as problem) {
    <div class="rail-status">
      <app-status-message severity="error" [message]="problem.message" />
    </div>
  }
</aside>

<section
  aria-roledescription="gallery"
  class="root"
  data-testid="product-gallery"
  tabindex="-1"
  (keydown)="onKeydown($event)"
>
  <div aria-label="Termékképek" class="frame" data-testid="gallery-main" tabindex="0">
    <button
      aria-label="Előző kép"
      class="step step--prev"
      data-testid="gallery-prev"
      type="button"
      [disabled]="!canPrev()"
      (click)="prev()"
    >
      ‹
    </button>
    @if (activeImage(); as img) {
      <app-product-image
        aspectRatio="4 / 3"
        [image]="img"
        [productName]="productName()"
        (loadFailed)="onImageFailed()"
      />
    }
    <button
      aria-label="Következő kép"
      class="step step--next"
      data-testid="gallery-next"
      type="button"
      [disabled]="!canNext()"
      (click)="next()"
    >
      ›
    </button>
    <button
      aria-label="Kép nagyítása"
      class="zoom"
      data-testid="gallery-zoom-open"
      type="button"
      (click)="openZoom()"
    >
      Nagyítás
    </button>
    <p aria-live="polite" class="count" data-testid="gallery-count">
      {{ activePosition() }} / {{ images().length }}
    </p>
    @if (idUnresolved()) {
      <p class="image-error" data-testid="gallery-image-error" role="status">
        A kiválasztott kép nem található; az első kép látható helyette.
      </p>
    }
  </div>
  <ol aria-label="Galéria indexképei" class="thumbs">
    @for (image of images(); let i = $index; track i) {
      <li>
        <button
          class="thumb"
          type="button"
          [attr.aria-current]="image.id === selectedImageId() ? 'true' : 'false'"
          [attr.aria-label]="`Ugrás a(z) ${i + 1}. képre`"
          [attr.data-testid]="`gallery-thumb-${i}`"
          (click)="goTo(image.id)"
        >
          <img
            alt=""
            aria-hidden="true"
            class="thumb-img"
            decoding="async"
            loading="lazy"
            [attr.height]="image.height"
            [attr.width]="image.width"
            [src]="image.src"
          />
          <span aria-hidden="true" class="thumb-check">✓</span>
        </button>
      </li>
    }
  </ol>
</section>
<app-accessible-dialog
  [label]="`Nagyított kép: ${productName()}`"
  [opened]="zoomOpen()"
  (closed)="closeZoom()"
>
  @if (activeImage(); as img) {
    <app-product-image
      aspectRatio="4 / 3"
      [image]="img"
      [productName]="productName()"
      (loadFailed)="onImageFailed()"
    />
  }
</app-accessible-dialog>

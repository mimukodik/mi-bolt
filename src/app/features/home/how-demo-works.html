<section aria-labelledby="how-heading" class="how" data-testid="how-demo-works" id="how">
  <div class="how__inner">
    <header class="how__header">
      <h2 class="how__title" id="how-heading">Három lépés. Egy új kedvenc.</h2>
      <p class="how__caption">Így működik a demó</p>
    </header>
    <ol class="how__grid" role="list">
      @for (tile of tiles; track tile.id; let i = $index) {
        <li class="how__tile" [attr.data-testid]="tile.id">
          <span aria-hidden="true" class="how__number">{{ numberLabel(i) }}</span>
          <span aria-hidden="true" class="how__icon">
            @switch (tile.id) {
              @case ('how-tile-browse') {
                <svg focusable="false" height="32" viewBox="0 0 32 32" width="32">
                  <circle
                    cx="14"
                    cy="14"
                    fill="none"
                    r="8"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                  <line
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-width="2"
                    x1="20"
                    x2="27"
                    y1="20"
                    y2="27"
                  />
                </svg>
              }
              @case ('how-tile-cart') {
                <svg focusable="false" height="32" viewBox="0 0 32 32" width="32">
                  <path
                    d="M6 8h3l2.5 14h13l3-10H11"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                  />
                  <circle cx="14" cy="26" fill="currentColor" r="1.6" />
                  <circle cx="23" cy="26" fill="currentColor" r="1.6" />
                </svg>
              }
              @case ('how-tile-order') {
                <svg focusable="false" height="32" viewBox="0 0 32 32" width="32">
                  <rect
                    fill="none"
                    height="20"
                    rx="3"
                    stroke="currentColor"
                    stroke-width="2"
                    width="20"
                    x="6"
                    y="6"
                  />
                  <polyline
                    fill="none"
                    points="11,17 15,21 22,12"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                  />
                </svg>
              }
            }
          </span>
          <h3 class="how__tile-title">{{ tile.title }}</h3>
          <p class="how__tile-body">{{ tile.body }}</p>
        </li>
      }
    </ol>
  </div>
</section>

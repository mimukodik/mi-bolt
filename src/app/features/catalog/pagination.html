<nav
  class="pagination flex items-center justify-center gap-3 pt-4"
  data-testid="catalog-pagination"
  aria-label="Lapozás"
>
  <button
    type="button"
    class="page min-h-10 min-w-10 px-4 rounded font-inherit cursor-pointer"
    data-testid="pagination-prev"
    [disabled]="page() <= 1 || disabled()"
    (click)="onBoundary(page() - 1); onPageClick(page() - 1)"
  >
    Előző
  </button>
  @for (n of pageNumbers(); track n) {
    <button
      #pageButton
      type="button"
      class="page min-h-10 min-w-10 px-4 rounded font-inherit cursor-pointer"
      [class.page--current]="n === page()"
      [attr.data-testid]="n === page() ? 'pagination-current' : 'pagination-page-' + n"
      [attr.aria-label]="n + '. oldal'"
      [attr.aria-current]="n === page() ? 'page' : null"
      [disabled]="disabled()"
      (click)="onPageClick(n)"
    >
      {{ n }}
    </button>
  }
  <button
    type="button"
    class="page min-h-10 min-w-10 px-4 rounded font-inherit cursor-pointer"
    data-testid="pagination-next"
    [disabled]="page() >= totalPages() || disabled()"
    (click)="onBoundary(page() + 1); onPageClick(page() + 1)"
  >
    Következő
  </button>
</nav>

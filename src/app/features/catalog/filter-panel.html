<section
  class="panel flex flex-col gap-6 p-5 rounded"
  data-testid="filter-panel"
  [attr.aria-busy]="disabled() ? 'true' : null"
>
  <header class="header flex items-center justify-between gap-3">
    <h2 class="title m-0">Szűrők</h2>
    <app-button
      data-testid="filter-reset"
      label="Szűrők törlése"
      variant="secondary"
      [disabled]="disabled() || !hasActiveFilters()"
      (pressed)="resetAll()"
    />
  </header>

  <fieldset class="group flex flex-col gap-2 m-0 p-0 border-0" data-testid="filter-group-search">
    <legend class="legend uppercase tracking-wider">Keresés</legend>
    <label class="search block">
      <span class="sr-only">Keresés a telefonok között</span>
      <input
        class="input w-full min-h-10 px-3 rounded font-inherit leading-none"
        data-testid="filter-search-input"
        placeholder="pl. Demo 5G"
        type="search"
        [disabled]="disabled()"
        [value]="searchDraft()"
        (input)="onSearchInput($event)"
      />
    </label>
  </fieldset>

  <fieldset class="group flex flex-col gap-2 m-0 p-0 border-0" data-testid="filter-group-brand">
    <legend class="legend uppercase tracking-wider">Márka</legend>
    <ul class="options flex flex-col gap-2 m-0 p-0 list-none" role="list">
      @for (brand of brandFacets(); track brand.value) {
        <li>
          <button
            class="option inline-flex items-center gap-2 w-full min-h-10 px-3 rounded font-inherit leading-none cursor-pointer text-left"
            type="button"
            [attr.aria-pressed]="isBrandSelected(brand.value) ? 'true' : 'false'"
            [attr.data-testid]="`filter-brand-${brand.value}`"
            [class.is-selected]="isBrandSelected(brand.value)"
            [disabled]="disabled() || brand.count === 0"
            (click)="toggleBrand(brand.value)"
          >
            <span
              aria-hidden="true"
              class="check inline-flex items-center justify-center w-5 font-bold"
              >{{ isBrandSelected(brand.value) ? '✓' : '' }}</span
            >
            <span class="option__label flex-1">{{ brand.label }}</span>
            <span aria-label="találatok száma" class="option__count">{{ brand.count }}</span>
          </button>
        </li>
      }
    </ul>
  </fieldset>

  <fieldset class="group flex flex-col gap-2 m-0 p-0 border-0" data-testid="filter-group-storage">
    <legend class="legend uppercase tracking-wider">Tárhely</legend>
    <ul class="options options--row flex flex-wrap gap-2 m-0 p-0 list-none" role="list">
      @for (bucket of storageBuckets(); track bucket) {
        <li>
          <button
            class="option option--chip inline-flex items-center gap-2 min-h-10 px-3 rounded font-inherit cursor-pointer"
            type="button"
            [attr.aria-pressed]="isStorageSelected(bucket) ? 'true' : 'false'"
            [attr.data-testid]="`filter-storage-${bucket}`"
            [class.is-selected]="isStorageSelected(bucket)"
            [disabled]="disabled()"
            (click)="toggleStorage(bucket)"
          >
            <span
              aria-hidden="true"
              class="check inline-flex items-center justify-center w-5 font-bold"
              >{{ isStorageSelected(bucket) ? '✓' : '' }}</span
            >
            <span>{{ bucket }} GB</span>
          </button>
        </li>
      }
    </ul>
  </fieldset>

  <fieldset class="group flex flex-col gap-2 m-0 p-0 border-0" data-testid="filter-group-price">
    <legend class="legend uppercase tracking-wider">Ár (Ft, egész szám)</legend>
    <div class="price grid grid-cols-2 gap-2">
      <label class="price__field flex flex-col gap-1">
        <span class="price__label">Min.</span>
        <input
          class="input w-full min-h-10 px-3 rounded font-inherit leading-none"
          data-testid="filter-min-price"
          inputmode="numeric"
          min="0"
          step="1000"
          type="number"
          [disabled]="disabled()"
          [value]="minDraft()"
          (input)="onMinInput($event)"
        />
      </label>
      <label class="price__field flex flex-col gap-1">
        <span class="price__label">Max.</span>
        <input
          class="input w-full min-h-10 px-3 rounded font-inherit leading-none"
          data-testid="filter-max-price"
          inputmode="numeric"
          min="0"
          step="1000"
          type="number"
          [disabled]="disabled()"
          [value]="maxDraft()"
          (input)="onMaxInput($event)"
        />
      </label>
    </div>
    @if (priceError()) {
      <app-form-field-message
        data-testid="filter-price-error"
        fieldId="filter-price"
        severity="error"
        [errors]="[{ code: 'INVALID_PRICE', message: priceError()!, pointer: 'price' }]"
        [touched]="true"
      />
    }
  </fieldset>

  <fieldset class="group flex flex-col gap-2 m-0 p-0 border-0" data-testid="filter-group-flags">
    <legend class="legend uppercase tracking-wider">További szűrők</legend>
    <button
      class="option option--toggle inline-flex items-center gap-2 w-full min-h-10 px-3 rounded font-inherit leading-none cursor-pointer text-left"
      type="button"
      [attr.aria-pressed]="isInStockSelected() ? 'true' : 'false'"
      [attr.data-testid]="'filter-inStock'"
      [class.is-selected]="isInStockSelected()"
      [disabled]="disabled()"
      (click)="toggleInStock()"
    >
      <span
        aria-hidden="true"
        class="check inline-flex items-center justify-center w-5 font-bold"
        >{{ isInStockSelected() ? '✓' : '' }}</span
      >
      <span>Csak raktáron</span>
    </button>
    <button
      class="option option--toggle inline-flex items-center gap-2 w-full min-h-10 px-3 rounded font-inherit leading-none cursor-pointer text-left"
      type="button"
      [attr.aria-pressed]="isFiveGSelected() ? 'true' : 'false'"
      [attr.data-testid]="'filter-is5g'"
      [class.is-selected]="isFiveGSelected()"
      [disabled]="disabled()"
      (click)="toggleFiveG()"
    >
      <span
        aria-hidden="true"
        class="check inline-flex items-center justify-center w-5 font-bold"
        >{{ isFiveGSelected() ? '✓' : '' }}</span
      >
      <span>Csak 5G</span>
    </button>
  </fieldset>
</section>

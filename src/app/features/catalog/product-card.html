<article class="card flex flex-col gap-3" data-testid="product-card">
  <a
    class="media"
    [routerLink]="detailsLink()"
    [queryParams]="detailsQuery()"
    [attr.aria-label]="ariaLabel()"
  >
    <span class="tag" data-testid="product-card-tag">DEMÓTERMÉK</span>
    <app-product-image
      data-testid="product-card-image"
      [image]="image()"
      [productName]="product().name"
      [aspectRatio]="'4 / 3'"
      [decorative]="true"
    ></app-product-image>
  </a>

  <div class="body flex flex-col gap-2 flex-1">
    <h3 class="name line-clamp-2">
      <a
        class="name-link"
        [routerLink]="detailsLink()"
        [queryParams]="detailsQuery()"
        [attr.aria-label]="product().name + ' részleteinek megnyitása'"
        >{{ product().name }}</a
      >
    </h3>
    <p class="variant">
      <span class="variant__color">{{ colorName() }}</span>
      <span class="variant__sep" aria-hidden="true">·</span>
      <span class="variant__storage">{{ product().storageGb }} GB</span>
    </p>
    @if (visibleHighlights().length > 0) {
      <p class="highlights" data-testid="product-card-highlights">
        @for (highlight of visibleHighlights(); track highlight; let last = $last) {
          <span class="highlights__item">{{ highlight }}</span>
          @if (!last) {
            <span aria-hidden="true" class="highlights__sep"> · </span>
          }
        }
      </p>
    }
    <div class="price-row mt-auto">
      <app-price-block
        [money]="price()"
        label="Egyszeri készülékár"
        status="success"
        size="md"
      ></app-price-block>
    </div>
  </div>

  <div class="cta">
    <a
      class="details"
      data-testid="product-card-cta"
      [routerLink]="detailsLink()"
      [queryParams]="detailsQuery()"
      [attr.aria-label]="product().name + ' részleteinek megnyitása'"
      >Megnézem</a
    >
  </div>
</article>

<article class="card flex flex-col gap-3 h-full p-4" data-testid="product-card">
  <a
    class="media block no-underline text-inherit rounded"
    [routerLink]="detailsLink()"
    [queryParams]="detailsQuery()"
    [attr.aria-label]="ariaLabel()"
  >
    <span class="tag" data-testid="product-card-tag">DEMÓTERMÉK</span>
    <app-product-image
      data-testid="product-card-image"
      [image]="image()"
      [productName]="product().name"
      [aspectRatio]="'4 / 3'"
      [decorative]="true"
    ></app-product-image>
  </a>

  <div class="body flex flex-col gap-2 flex-1">
    <h3 class="name m-0">
      <a
        class="name-link no-underline"
        [routerLink]="detailsLink()"
        [queryParams]="detailsQuery()"
        [attr.aria-label]="product().name + ' részleteinek megnyitása'"
        >{{ product().name }}</a
      >
    </h3>
    <p class="variant m-0 inline-flex gap-2 items-center">
      <span class="variant__color">{{ colorName() }}</span>
      <span class="variant__sep" aria-hidden="true">·</span>
      <span class="variant__storage">{{ product().storageGb }} GB</span>
    </p>
    @if (visibleHighlights().length > 0) {
      <ul class="highlights m-0 pl-4 flex flex-col gap-1" data-testid="product-card-highlights">
        @for (highlight of visibleHighlights(); track highlight) {
          <li>{{ highlight }}</li>
        }
      </ul>
    }
    <div class="price-row mt-auto">
      <app-price-block
        [money]="price()"
        label="Egyszeri készülékár • demóadat"
        status="success"
      ></app-price-block>
    </div>
  </div>

  <div class="cta flex items-center">
    <a
      class="details inline-flex items-center justify-center min-h-10 px-4 rounded border bg-transparent font-medium leading-none no-underline cursor-pointer"
      data-testid="product-card-cta"
      [routerLink]="detailsLink()"
      [queryParams]="detailsQuery()"
      [attr.aria-label]="product().name + ' részleteinek megnyitása'"
      >Részletek</a
    >
  </div>
</article>

@if (chips().length > 0) {
  <div class="chips flex flex-wrap items-center gap-2" data-testid="applied-filters">
    @for (chip of chips(); track chip.id) {
      <span class="chip inline-flex items-center gap-2 px-3" data-testid="applied-chip">
        <span class="chip__label">{{ chip.label }}</span>
        <button
          type="button"
          class="chip__remove"
          [attr.aria-label]="'Szűrő eltávolítása: ' + chip.label"
          [attr.data-testid]="'applied-chip-remove-' + testId(chip.name)"
          (click)="onRemove(chip.name, chip.value)"
        >
          ✕
        </button>
      </span>
    }
    <button
      type="button"
      class="chip-clear"
      data-testid="applied-filters-clear"
      (click)="cleared.emit()"
    >
      Összes szűrő törlése
    </button>
  </div>
}

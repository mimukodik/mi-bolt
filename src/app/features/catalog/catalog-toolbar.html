<div class="toolbar">
  <div class="row toolbar__top">
    <div #resultCount class="result-count" data-testid="result-count" tabindex="-1">
      {{ resultCountLabel() }}
    </div>
    <button
      #filterTrigger
      class="trigger"
      data-testid="filter-trigger"
      type="button"
      [attr.aria-controls]="'filter-drawer'"
      [attr.aria-expanded]="drawerExpanded() ? 'true' : 'false'"
      (click)="openFilters.emit()"
    >
      Szűrők{{ appliedCount() > 0 ? ` (${appliedCount()})` : '' }}
    </button>
  </div>

  <div class="row toolbar__selects">
    <label class="select-field sort">
      <span class="select-field__label">Rendezés</span>
      <select
        class="select"
        data-testid="catalog-sort"
        [disabled]="status() === 'loading'"
        (change)="onSortChange($event)"
      >
        @for (mode of sortModes; track mode) {
          <option [selected]="mode === sort()" [value]="mode">
            {{ sortLabel(mode) }}
          </option>
        }
      </select>
    </label>
    <label class="select-field page-size">
      <span class="select-field__label">Oldalméret</span>
      <select
        class="select"
        data-testid="catalog-page-size"
        [disabled]="status() === 'loading'"
        [value]="pageSize()"
        (change)="onPageSizeChange($event)"
      >
        <option value="12">12 / oldal</option>
        <option value="24">24 / oldal</option>
      </select>
    </label>
  </div>
</div>

<section class="catalog">
  <header class="heading flex flex-col gap-2 pb-6 border-b border-[var(--color-line)]">
    <nav aria-label="Navigáció" class="breadcrumbs flex gap-2 items-center">
      <a class="breadcrumb no-underline" routerLink="/">Főoldal</a>
      <span aria-hidden="true" class="breadcrumb__sep">/</span>
      <span aria-current="page" class="breadcrumb is-current">Mobiltelefonok</span>
    </nav>
    <h1 class="title m-0">Mobiltelefonok</h1>
    <p class="lede m-0 max-w-prose">
      Válaszd ki a hozzád illő készüléket a demó kínálatból – minden termék kipróbálható a
      pénztárig, valódi vásárlás nélkül.
    </p>
  </header>

  <div class="layout gap-6">
    <aside class="sidebar" data-testid="filter-sidebar">
      <app-filter-panel
        [busy]="facetsBusy()"
        [disabled]="controlsDisabled()"
        [facets]="facade.vm().facets"
        [value]="facade.query()"
        (filtersChanged)="onFiltersChanged($event)"
      />
    </aside>

    <div class="results flex flex-col gap-5 min-w-0">
      <h2 class="sr-only absolute w-px h-px overflow-hidden">Találatok</h2>
      <app-catalog-toolbar
        [appliedCount]="appliedChipCount()"
        [pageSize]="currentPageSize()"
        [sort]="currentSort()"
        [status]="toolbarStatus()"
        [total]="facade.vm().total"
        (openFilters)="openDrawer()"
        (pageSizeChanged)="onPageSizeChanged($event)"
        (sortChanged)="onSortChanged($event)"
      />

      <app-applied-filters
        [chips]="appliedChips()"
        (cleared)="onClearAll()"
        (filterRemoved)="onChipRemoved($event)"
      />

      <app-async-content
        [hasPrevious]="hasPrevious()"
        [problem]="problem()"
        [status]="asyncStatus()"
        (retryRequested)="onRetry()"
      >
        @for (item of facade.vm().items; track item.variantId) {
          <app-product-card [product]="item" />
        }
        <app-button
          data-async-empty-action
          label="Szűrők törlése"
          variant="primary"
          (pressed)="onClearAll()"
        />
      </app-async-content>

      @if (shouldShowPagination()) {
        <app-pagination
          [disabled]="controlsDisabled()"
          [page]="currentPage()"
          [pageSize]="currentPageSize()"
          [total]="facade.vm().total"
          (pageChanged)="onPageChanged($event)"
        />
      }
    </div>
  </div>

  <app-filter-drawer
    id="filter-drawer"
    [applied]="facade.query()"
    [busy]="facetsBusy()"
    [disabled]="controlsDisabled()"
    [facets]="facade.vm().facets"
    [opened]="drawerOpened()"
    [restoreEl]="filterTrigger()"
    (closed)="closeDrawer()"
    (filtersChanged)="onFiltersChanged($event)"
  />
</section>

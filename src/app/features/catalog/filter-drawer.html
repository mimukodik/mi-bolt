<app-accessible-dialog
  label="Szűrők"
  [opened]="opened()"
  [restoreTarget]="restoreEl()"
  (closed)="onDialogClosed()"
>
  <form
    class="drawer flex flex-col gap-5"
    data-testid="filter-drawer"
    (submit)="$event.preventDefault(); applyDraft()"
  >
    <p class="intro m-0">Állítsd be a szűrőket, majd az „Alkalmazás" gombra kattints.</p>

    <fieldset class="group flex flex-col gap-2 m-0 p-0 border-0" data-testid="drawer-group-brand">
      <legend class="legend uppercase tracking-wider">Márka</legend>
      <ul class="options flex flex-col gap-2 m-0 p-0 list-none" role="list">
        @for (brand of brandFacets(); track brand.value) {
          <li>
            <button
              class="option inline-flex items-center gap-2 w-full min-h-10 px-3 rounded font-inherit leading-none cursor-pointer text-left"
              type="button"
              [attr.aria-pressed]="isBrandSelected(brand.value) ? 'true' : 'false'"
              [attr.data-testid]="`drawer-brand-${brand.value}`"
              [class.is-selected]="isBrandSelected(brand.value)"
              [disabled]="disabled() || brand.count === 0"
              (click)="toggleBrand(brand.value)"
            >
              <span
                aria-hidden="true"
                class="check inline-flex items-center justify-center w-5 font-bold"
                >{{ isBrandSelected(brand.value) ? '✓' : '' }}</span
              >
              <span class="option__label flex-1">{{ brand.label }}</span>
              <span class="option__count">{{ brand.count }}</span>
            </button>
          </li>
        }
      </ul>
    </fieldset>

    <fieldset class="group flex flex-col gap-2 m-0 p-0 border-0" data-testid="drawer-group-storage">
      <legend class="legend uppercase tracking-wider">Tárhely</legend>
      <div class="chips flex flex-wrap gap-2">
        @for (bucket of storageBuckets(); track bucket) {
          <button
            class="chip inline-flex items-center gap-2 min-h-10 px-3 rounded font-inherit cursor-pointer"
            type="button"
            [attr.aria-pressed]="isStorageSelected(bucket) ? 'true' : 'false'"
            [attr.data-testid]="`drawer-storage-${bucket}`"
            [class.is-selected]="isStorageSelected(bucket)"
            [disabled]="disabled()"
            (click)="toggleStorage(bucket)"
          >
            <span
              aria-hidden="true"
              class="check inline-flex items-center justify-center w-5 font-bold"
              >{{ isStorageSelected(bucket) ? '✓' : '' }}</span
            >
            <span>{{ bucket }} GB</span>
          </button>
        }
      </div>
    </fieldset>

    <fieldset class="group flex flex-col gap-2 m-0 p-0 border-0" data-testid="drawer-group-price">
      <legend class="legend uppercase tracking-wider">Ár (Ft, egész szám)</legend>
      <div class="price grid grid-cols-2 gap-2">
        <label class="price__field flex flex-col gap-1">
          <span class="price__label">Min.</span>
          <input
            class="input w-full min-h-10 px-3 rounded font-inherit leading-none"
            data-testid="drawer-min-price"
            inputmode="numeric"
            min="0"
            step="1000"
            type="number"
            [disabled]="disabled()"
            [value]="minDraft()"
            (input)="onMinInput($event)"
          />
        </label>
        <label class="price__field flex flex-col gap-1">
          <span class="price__label">Max.</span>
          <input
            class="input w-full min-h-10 px-3 rounded font-inherit leading-none"
            data-testid="drawer-max-price"
            inputmode="numeric"
            min="0"
            step="1000"
            type="number"
            [disabled]="disabled()"
            [value]="maxDraft()"
            (input)="onMaxInput($event)"
          />
        </label>
      </div>
      @if (priceError()) {
        <app-form-field-message
          data-testid="drawer-price-error"
          fieldId="drawer-price"
          severity="error"
          [errors]="[{ code: 'INVALID_PRICE', message: priceError()!, pointer: 'price' }]"
          [touched]="true"
        />
      }
    </fieldset>

    <fieldset class="group flex flex-col gap-2 m-0 p-0 border-0" data-testid="drawer-group-flags">
      <legend class="legend uppercase tracking-wider">További szűrők</legend>
      <button
        class="option inline-flex items-center gap-2 w-full min-h-10 px-3 rounded font-inherit leading-none cursor-pointer text-left"
        type="button"
        [attr.aria-pressed]="isInStockSelected() ? 'true' : 'false'"
        [attr.data-testid]="'drawer-inStock'"
        [class.is-selected]="isInStockSelected()"
        [disabled]="disabled()"
        (click)="toggleInStock()"
      >
        <span
          aria-hidden="true"
          class="check inline-flex items-center justify-center w-5 font-bold"
          >{{ isInStockSelected() ? '✓' : '' }}</span
        >
        <span>Csak raktáron</span>
      </button>
      <button
        class="option inline-flex items-center gap-2 w-full min-h-10 px-3 rounded font-inherit leading-none cursor-pointer text-left"
        type="button"
        [attr.aria-pressed]="isFiveGSelected() ? 'true' : 'false'"
        [attr.data-testid]="'drawer-is5g'"
        [class.is-selected]="isFiveGSelected()"
        [disabled]="disabled()"
        (click)="toggleFiveG()"
      >
        <span
          aria-hidden="true"
          class="check inline-flex items-center justify-center w-5 font-bold"
          >{{ isFiveGSelected() ? '✓' : '' }}</span
        >
        <span>Csak 5G</span>
      </button>
    </fieldset>

    <footer class="footer flex justify-end gap-3 pt-4 sticky bottom-0" data-testid="drawer-footer">
      <app-button
        data-testid="drawer-cancel"
        label="Mégse"
        variant="secondary"
        (pressed)="cancelDraft()"
      />
      <app-button
        data-testid="drawer-apply"
        variant="primary"
        [disabled]="!canApply()"
        [label]="applyLabel()"
        (pressed)="applyDraft()"
      />
    </footer>
  </form>
</app-accessible-dialog>

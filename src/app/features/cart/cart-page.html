<section class="cart flex flex-col gap-6" data-testid="cart-page">
  <header class="heading flex flex-col gap-3">
    <nav aria-label="Navigáció" class="breadcrumbs flex flex-wrap gap-2">
      <a class="breadcrumb no-underline" routerLink="/">Főoldal</a>
      <span aria-hidden="true" class="breadcrumb__sep mx-1">/</span>
      <span aria-current="page" class="breadcrumb is-current font-medium">Kosár</span>
    </nav>
    <h1 class="title m-0 font-bold">A kosarad</h1>
  </header>

  @if (statusMessage(); as message) {
    <div class="status flex">
      <app-status-message
        [message]="message.text"
        [severity]="message.severity"
        (dismissed)="dismissStatusMessage()"
      />
    </div>
  }

  @switch (state()) {
    @case ('loading') {
      <div class="loading flex items-center justify-center min-h-72" data-testid="cart-loading">
        <app-loading-state label="Kosár betöltése" variant="card" />
      </div>
    }
    @case ('error') {
      <app-error-state
        retryLabel="Újrapróbálom"
        title="A kosár nem érhető el"
        [message]="errorMessage()"
        [pending]="revalidating()"
        [preserving]="true"
        (retryRequested)="onRetry()"
      />
    }
    @case ('empty') {
      <app-empty-state
        actionLabel="Telefonokat nézek"
        actionVariant="primary"
        message="Nézd meg a demókészülékeket, és válaszd ki a kedvenced."
        title="A kosarad még üres."
        (actionRequested)="onContinueShopping()"
      />
    }
    @default {
      <div
        class="layout flex flex-col gap-5 lg:grid lg:grid-cols-[1fr_360px] lg:gap-6 lg:items-start"
        data-testid="cart-layout"
      >
        <div class="lines">
          <ul class="lines-list m-0 p-0 list-none flex flex-col gap-3">
            @for (item of items(); track item.id) {
              <li>
                <app-cart-line
                  [line]="item"
                  [pending]="pendingItemIds().has(item.id)"
                  (quantityChanged)="onQuantityChanged(item, $event)"
                  (removeRequested)="onRemoveRequested($event)"
                />
              </li>
            }
          </ul>
        </div>

        <app-order-summary
          [footnote]="summaryFootnote()"
          [shipping]="null"
          [subtotal]="subtotal()"
        />
      </div>

      <footer
        class="footer flex flex-col gap-4 p-5 rounded lg:flex-row lg:items-center lg:justify-between lg:gap-6"
        data-testid="cart-footer"
      >
        <div class="footer-meta flex flex-col gap-2">
          <app-price-block label="Részösszeg" status="success" [money]="subtotal()" />
          <p class="footer-hint m-0">A következő lépésben választod ki.</p>
        </div>
        <div
          class="footer-actions flex flex-col gap-3 lg:flex-row lg:justify-between lg:items-center lg:flex-0 lg:flex-shrink-0"
        >
          <app-button
            label="Vásárlás folytatása"
            variant="secondary"
            (pressed)="onContinueShopping()"
          />
          <app-button
            data-testid="cart-continue"
            label="Tovább az adatokhoz"
            loadingLabel="Ellenőrzés…"
            variant="primary"
            [disabled]="!canContinue()"
            [loading]="continuing()"
            (pressed)="onContinue()"
          />
        </div>
      </footer>
    }
  }
</section>

<article
  class="line grid gap-4"
  data-testid="cart-line"
  [attr.aria-busy]="pending() ? 'true' : null"
>
  <div class="media flex items-start justify-center min-w-0">
    <app-product-image
      aspectRatio="1 / 1"
      [image]="imageLike()"
      [productName]="line().productName"
    />
  </div>

  <div class="body flex flex-col gap-3 min-w-0">
    <header class="header flex flex-col gap-1">
      <h3 class="name m-0" data-testid="cart-line-name">{{ line().productName }}</h3>
      <p class="variant m-0">
        <span class="variant-color">{{ line().colorName }}</span>
        <span aria-hidden="true" class="variant-sep mx-2">·</span>
        <span class="variant-storage">{{ line().storageGb }} GB</span>
      </p>
    </header>

    <div class="quantity-row flex flex-col gap-2">
      <span aria-hidden="true" class="qty-label">Darabszám</span>
      <app-quantity-control
        label="Darabszám"
        [disabled]="pending()"
        [max]="maxQuantity()"
        [min]="1"
        [pending]="pending()"
        [value]="line().quantity"
        (quantityChanged)="onQuantityChanged($event)"
      />
    </div>
  </div>

  <div class="totals flex flex-row justify-between items-baseline">
    <button
      class="remove"
      data-testid="cart-line-remove"
      type="button"
      [attr.aria-label]="`Törlés: ${line().productName}`"
      [disabled]="pending()"
      (click)="onRemoveRequested()"
    >
      Törlés
    </button>
    <app-price-block label="Részösszeg" size="md" status="success" [money]="line().lineTotal" />
  </div>
</article>

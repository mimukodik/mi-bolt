<article class="line grid gap-4 p-4 rounded" [attr.aria-busy]="pending() ? 'true' : null" data-testid="cart-line">
  <div class="media flex items-start justify-center min-w-0">
    <app-product-image
      [image]="imageLike()"
      [productName]="line().productName"
    ></app-product-image>
  </div>

  <div class="body flex flex-col gap-3 min-w-0">
    <header class="header flex flex-col gap-1">
      <h3 class="name m-0 font-bold" data-testid="cart-line-name">{{ line().productName }}</h3>
      <p class="variant m-0">
        <span class="variant-color">{{ line().colorName }}</span>
        <span class="variant-sep mx-2" aria-hidden="true">·</span>
        <span class="variant-storage">{{ line().storageGb }} GB</span>
      </p>
    </header>

    <div class="prices flex items-center">
      <app-price-block
        [money]="line().unitPrice"
        [label]="'Egységár'"
        [status]="'success'"
      ></app-price-block>
    </div>

    <div class="quantity-row flex flex-col gap-2">
      <label class="qty-label" [attr.for]="quantityId()">Darabszám</label>
      <app-quantity-control
        [id]="quantityId()"
        [value]="line().quantity"
        [min]="1"
        [max]="maxQuantity()"
        [disabled]="pending()"
        [pending]="pending()"
        [label]="'Darabszám'"
        (quantityChanged)="onQuantityChanged($event)"
      ></app-quantity-control>
    </div>
  </div>

  <div class="totals hidden lg:flex flex-col items-end justify-between gap-3 min-w-45">
    <app-price-block
      [money]="line().lineTotal"
      [label]="'Részösszeg'"
      [status]="'success'"
    ></app-price-block>
    <button
      type="button"
      class="remove inline-flex items-center justify-center min-w-10 h-10 px-4 rounded font-medium cursor-pointer"
      [attr.aria-label]="'Törlés: ' + line().productName"
      [disabled]="pending()"
      (click)="onRemoveRequested()"
      data-testid="cart-line-remove"
    >
      Törlés
    </button>
  </div>
</article>

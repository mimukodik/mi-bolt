<aside
  aria-label="Rendelés összesítése"
  class="summary flex flex-col gap-4 p-5"
  data-testid="order-summary"
  [attr.data-inverse]="inverse() ? '' : null"
>
  <h2 class="title m-0 font-bold">{{ inverse() ? 'Összesen' : 'Rendelés összesítése' }}</h2>

  <div class="rows flex flex-col gap-3">
    <div class="row row--subtotal" data-testid="order-summary-subtotal">
      <app-price-block
        label="Részösszeg"
        [inverse]="inverse()"
        [layout]="priceBlockLayout()"
        [money]="subtotal()"
        [size]="priceBlockSize()"
        [status]="subtotalStatus()"
      />
    </div>

    <div class="row row--shipping" data-testid="order-summary-shipping">
      @if (shipping(); as fee) {
        <app-price-block
          label="Szállítási díj"
          status="success"
          [inverse]="inverse()"
          [layout]="priceBlockLayout()"
          [money]="fee"
          [size]="priceBlockSize()"
        />
      } @else {
        <span class="label">Szállítás</span>
        <span class="placeholder" data-testid="shipping-placeholder">
          A következő lépésben választod ki.
        </span>
      }
    </div>

    @if (paymentFee(); as fee) {
      <div class="row" data-testid="order-summary-payment-fee">
        <app-price-block
          label="Fizetési díj"
          status="success"
          [inverse]="inverse()"
          [layout]="priceBlockLayout()"
          [money]="fee"
          [size]="priceBlockSize()"
        />
      </div>
    }

    <div class="row row--total" data-testid="order-summary-total">
      <app-price-block
        label="Végösszeg"
        size="lg"
        [inverse]="inverse()"
        [layout]="priceBlockLayout()"
        [money]="total()"
        [status]="totalStatus()"
      />
    </div>
  </div>

  @if (footnote()) {
    <p class="footnote m-0" data-testid="order-summary-footnote">{{ footnote() }}</p>
  }

  <ng-content />
</aside>

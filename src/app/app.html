  by toggling its `hidden` attribute in the catch handler.
-->

>

  <p class="m-0 leading-relaxed">
    A bemutató nem tudott elindulni. Frissítsd az oldalt, vagy ellenőrizd a böngésző konzolját a
    részletekért.
  </p>
</app-fatal>

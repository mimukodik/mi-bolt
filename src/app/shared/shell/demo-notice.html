<aside
  class="demo-notice"
  data-testid="demo-notice"
  id="demo"
  role="status"
  [class.demo-notice--memory]="persistenceMode() === 'memory'"
>
  <span aria-hidden="true" class="demo-notice__badge">DEMÓ</span>
  @if (persistenceMode() === 'memory') {
    <span class="demo-notice__text" data-testid="demo-notice-memory-text">
      A böngésződ nem engedi a mentést, ezért az oldal frissítésekor a kosarad tartalma elveszik.
    </span>
  } @else {
    <span class="demo-notice__text">
      Fiktív termékek és árak. A vásárlás szimulált; nem történik valódi fizetés.
    </span>
  }
</aside>

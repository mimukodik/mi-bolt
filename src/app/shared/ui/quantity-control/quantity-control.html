<div
  class="root inline-flex flex-col gap-1"
  data-testid="quantity-control"
  [class.is-disabled]="disabled()"
  [class.is-invalid]="invalid()"
>
  <div class="row inline-flex items-center">
    <button
      class="step inline-flex items-center justify-center min-w-10 h-10 rounded font-medium cursor-pointer leading-none"
      data-testid="quantity-decrement"
      type="button"
      [attr.aria-label]="'Darabszám csökkentése'"
      [disabled]="decrementDisabled()"
      (click)="decrement()"
    >
      −
    </button>
    <input
      class="value inline-flex items-center justify-center w-16 h-10 border-l-0 border-r-0 text-center tabular-nums font-inherit leading-none cursor-text"
      data-testid="quantity-input"
      inputmode="numeric"
      type="text"
      [attr.aria-describedby]="invalid() ? describedById : null"
      [attr.aria-invalid]="invalid() ? 'true' : 'false'"
      [attr.aria-label]="label()"
      [disabled]="disabled()"
      [value]="displayValue()"
      (blur)="onBlur()"
      (input)="onInput($event)"
    />
    <button
      class="step inline-flex items-center justify-center min-w-10 h-10 rounded font-medium cursor-pointer leading-none"
      data-testid="quantity-increment"
      type="button"
      [attr.aria-label]="'Darabszám növelése'"
      [disabled]="incrementDisabled()"
      (click)="increment()"
    >
      +
    </button>
  </div>
  @if (invalid() && message()) {
    <p
      aria-live="polite"
      class="message m-0 px-2"
      data-testid="quantity-message"
      role="status"
      [id]="describedById"
    >
      {{ message() }}
    </p>
  }
</div>

<p
  class="root mt-1"
  data-testid="form-field-message"
  [attr.data-pointer]="showMessage() ? dataPointer() : null"
  [class.is-error]="severity() === 'error'"
  [class.is-help]="severity() === 'help'"
  [hidden]="!showMessage()"
  [id]="describedById()"
>
  {{ showMessage() ? visibleText() : '' }}
</p>

<section
  class="root flex flex-col items-center text-center p-6"
  role="status"
  aria-live="polite"
  data-testid="empty-state"
>
  <h2 class="title m-0 font-bold">{{ title() }}</h2>
  <p class="message m-0 leading-relaxed">{{ message() }}</p>
  @if (actionLabel(); as label) {
    <div class="actions mt-4 flex items-center justify-center">
      <app-button
        [variant]="actionVariant()"
        [label]="label"
        (pressed)="actionRequested.emit()"
      ></app-button>
    </div>
  }
</section>

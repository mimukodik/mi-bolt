<section
  aria-live="polite"
  class="root flex flex-col items-start gap-3 p-6 rounded"
  data-testid="error-state"
  role="alert"
>
  <h2 class="title m-0 font-bold">{{ title() }}</h2>
  <p class="message m-0">{{ message() }}</p>
  @if (preserving()) {
    <p class="hint m-0" data-testid="error-hint">A korábban megadott értékeket megőrizzük.</p>
  }
  <div class="actions mt-2">
    <app-button
      loadingLabel="Újrapróbálom…"
      size="standard"
      variant="primary"
      [label]="pending() ? 'Újrapróbálom…' : retryLabel()"
      [loading]="pending()"
      (pressed)="retryRequested.emit()"
    />
  </div>
</section>

<app-mobile-drawer
  [opened]="opened()"
  [triggerEl]="triggerEl()"
  (closed)="closed.set(true)"
>
  @for (link of navLinks(); track link.label) {
    <a [href]="link.routerLink">{{ link.label }}</a>
  }
</app-mobile-drawer>
<button #trigger type="button" data-testid="drawer-trigger">Menü</button>

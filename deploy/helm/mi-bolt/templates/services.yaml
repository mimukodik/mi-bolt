apiVersion: v1
kind: Service
metadata:
  name: {{ include "mi-bolt.fullname" . }}-commerce
  labels:
    {{- include "mi-bolt.labels" . | nindent 4 }}
    app.kubernetes.io/component: commerce
spec:
  type: ClusterIP
  selector:
    {{- include "mi-bolt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: commerce
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mi-bolt.fullname" . }}-web
  labels:
    {{- include "mi-bolt.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "mi-bolt.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http

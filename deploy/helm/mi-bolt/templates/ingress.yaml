{{- $originHost := trimPrefix "https://" .Values.publicOrigin | splitList ":" | first -}}
{{- if ne $originHost .Values.ingress.host -}}
{{- fail "publicOrigin host must match ingress.host" -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mi-bolt.fullname" . }}
  labels:
    {{- include "mi-bolt.labels" . | nindent 4 }}
  annotations:
    {{- include "mi-bolt.candidateAnnotations" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mi-bolt.fullname" . }}-web
                port:
                  name: http

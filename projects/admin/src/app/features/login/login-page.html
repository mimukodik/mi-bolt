<main class="min-h-dvh grid place-items-center p-4">
  <mat-card class="w-full max-w-md">
    <mat-card-header>
      <mat-card-subtitle>MiBolt Admin</mat-card-subtitle>
      <h1 mat-card-title>Bejelentkezés</h1>
    </mat-card-header>
    <mat-card-content>
      <form novalidate (submit)="onSubmit($event)">
        <mat-form-field class="w-full">
          <mat-label>Felhasználónév</mat-label>
          <input autocomplete="username" matInput [formField]="form.username" />
          <mat-error>{{ form.username().errors()[0]?.message }}</mat-error>
        </mat-form-field>
        <mat-form-field class="w-full">
          <mat-label>Jelszó</mat-label>
          <input
            autocomplete="current-password"
            matInput
            [formField]="form.password"
            [type]="passwordVisible() ? 'text' : 'password'"
          />
          <button
            matIconButton
            matSuffix
            type="button"
            [attr.aria-label]="passwordVisible() ? 'Jelszó elrejtése' : 'Jelszó megjelenítése'"
            [attr.aria-pressed]="passwordVisible()"
            (click)="togglePassword()"
          >
            <mat-icon>{{ passwordVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>{{ form.password().errors()[0]?.message }}</mat-error>
        </mat-form-field>
        <p class="adm-login-error" id="login-error" role="alert">{{ loginError() ?? '' }}</p>
        <div class="flex justify-end">
          <button matButton="filled" type="submit" [disabled]="attempt.disabled(form)">
            Belépés
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</main>

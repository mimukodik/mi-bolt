<h2 mat-dialog-title>Jelszó módosítása</h2>
<form novalidate (submit)="onSubmit($event)">
  <mat-dialog-content>
    <mat-form-field class="w-full">
      <mat-label>Jelenlegi jelszó</mat-label>
      <input
        autocomplete="current-password"
        matInput
        [formField]="form.currentPassword"
        [type]="currentVisible() ? 'text' : 'password'"
      />
      <button
        matIconButton
        matSuffix
        type="button"
        [attr.aria-label]="currentVisible() ? 'Jelszó elrejtése' : 'Jelszó megjelenítése'"
        [attr.aria-pressed]="currentVisible()"
        (click)="currentVisible.set(!currentVisible())"
      >
        <mat-icon>{{ currentVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>{{ form.currentPassword().errors()[0]?.message }}</mat-error>
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Új jelszó</mat-label>
      <input
        autocomplete="new-password"
        matInput
        [formField]="form.newPassword"
        [type]="newVisible() ? 'text' : 'password'"
      />
      <button
        matIconButton
        matSuffix
        type="button"
        [attr.aria-label]="newVisible() ? 'Jelszó elrejtése' : 'Jelszó megjelenítése'"
        [attr.aria-pressed]="newVisible()"
        (click)="newVisible.set(!newVisible())"
      >
        <mat-icon>{{ newVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>{{ form.newPassword().errors()[0]?.message }}</mat-error>
    </mat-form-field>

    <mat-form-field class="w-full">
      <mat-label>Új jelszó még egyszer</mat-label>
      <input
        autocomplete="new-password"
        matInput
        [formField]="form.confirmPassword"
        [type]="confirmVisible() ? 'text' : 'password'"
      />
      <button
        matIconButton
        matSuffix
        type="button"
        [attr.aria-label]="confirmVisible() ? 'Jelszó elrejtése' : 'Jelszó megjelenítése'"
        [attr.aria-pressed]="confirmVisible()"
        (click)="confirmVisible.set(!confirmVisible())"
      >
        <mat-icon>{{ confirmVisible() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>{{ form.confirmPassword().errors()[0]?.message }}</mat-error>
    </mat-form-field>

    <p class="adm-dialog-error" role="alert">{{ failure() ?? '' }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-dialog-close matButton type="button">Mégse</button>
    <button matButton="filled" type="submit" [disabled]="attempt.disabled(form)">Mentés</button>
  </mat-dialog-actions>
</form>

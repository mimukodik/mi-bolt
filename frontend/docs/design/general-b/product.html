<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arc 5G · MiBolt</title>
    <link rel="stylesheet" href="style.css" />
    <script src="shop.js" defer></script>
  </head>
  <body class="product">
    <a class="skip" href="#tartalom">Ugrás a tartalomra</a>
    <header class="site-header">
      <div class="wrap masthead">
        <a class="wordmark" href="index.html"><span aria-hidden="true">▰</span> MiBolt</a>
        <nav aria-label="Fő navigáció">
          <a class="nav-home" href="index.html">Főoldal</a
          ><a class="nav-catalogue" href="catalogue.html">Telefonok</a
          ><a class="nav-cart" href="cart.html">Kosár<span data-cart-count></span></a>
        </nav>
      </div>
    </header>
    <main id="tartalom">
      <div class="wrap product-main">
        <a class="back-link" href="catalogue.html">← Telefonok</a>
        <div class="product-layout">
          <div class="product-heading">
            <p data-product="brand">Forma</p>
            <h1 data-product="name">Arc 5G</h1>
          </div>
          <figure class="gallery" data-gallery>
            <div class="gallery-stage">
              <img
                data-gallery-image
                data-side="front"
                src="assets/graphite-front.webp"
                width="320"
                height="400"
                alt="Arc 5G, grafit"
              />
            </div>
            <div class="thumbnail-rail">
              <button type="button" aria-label="Elölnézet" data-side="front" aria-pressed="true">
                <img
                  class=""
                  src="assets/graphite-front.webp"
                  width="320"
                  height="400"
                  alt=""
                /></button
              ><button type="button" aria-label="Hátulnézet" data-side="back" aria-pressed="false">
                <img class="" src="assets/graphite-back.webp" width="320" height="400" alt="" />
              </button>
            </div>
          </figure>
          <form class="order" data-product-order>
            <fieldset>
              <legend>Szín</legend>
              <div class="option-row">
                <label
                  ><input type="radio" name="szin" value="graphite" checked /><span
                    ><span class="swatch graphite"></span>Grafit</span
                  ></label
                >
                <label
                  ><input type="radio" name="szin" value="silver" /><span
                    ><span class="swatch silver"></span>Ezüst</span
                  ></label
                >
              </div>
            </fieldset>
            <fieldset>
              <legend>Tárhely</legend>
              <div class="option-row">
                <label
                  ><input type="radio" name="tarhely" value="128" checked /><span
                    >128 GB</span
                  ></label
                >
                <label><input type="radio" name="tarhely" value="256" /><span>256 GB</span></label>
              </div>
            </fieldset>
            <div class="purchase">
              <div class="price-block">
                <p class="stock"><span aria-hidden="true"></span> Raktáron</p>
                <strong data-variant-price role="status">189 990 Ft</strong>
              </div>
              <button class="button" type="submit">
                Kosárba <span aria-hidden="true">↗</span>
              </button>
            </div>
          </form>
        </div>
        <section class="spec-section" aria-labelledby="spec-title">
          <h2 id="spec-title">Műszaki adatok</h2>
          <dl class="spec-list">
            <div>
              <dt>Kijelző</dt>
              <dd data-product="screen">6,4″ OLED</dd>
            </div>
            <div>
              <dt>Főkamera</dt>
              <dd data-product="camera">50 MP</dd>
            </div>
            <div>
              <dt>Akkumulátor</dt>
              <dd data-product="battery">4 800 mAh</dd>
            </div>
            <div>
              <dt>Hálózat</dt>
              <dd>5G</dd>
            </div>
          </dl>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="wrap footer-inner">
        <a href="index.html" class="wordmark"><span aria-hidden="true">▰</span> MiBolt</a>
        <p>Demóáruház · Fiktív készülékek</p>
        <a href="catalogue.html">Telefonok felfedezése ↗</a>
      </div>
    </footer>
  </body>
</html>

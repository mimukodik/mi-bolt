<adm-section-card title="Megjelenítés" [errorCount]="errorCount()">
  <div class="grid grid-cols-2 gap-x-4 xl:grid-cols-1">
    <div class="col-span-2 flex flex-wrap items-center gap-x-4 xl:col-span-1">
      <mat-slide-toggle [formField]="form().featured">Kiemelt</mat-slide-toggle>
      <p class="adm-featured-hint">{{ featuredHint() }}</p>
    </div>
    <adm-control-error
      class="col-span-2 xl:col-span-1"
      errorId="adm-featured-error"
      [field]="form().featured"
    />
    <mat-form-field>
      <mat-label>Rangsor</mat-label>
      <input matInput type="number" [formField]="form().rank" />
      <mat-error>{{ form().rank().errors()[0]?.message }}</mat-error>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Népszerűség</mat-label>
      <input matInput type="number" [formField]="form().popularityScore" />
      <mat-error>{{ form().popularityScore().errors()[0]?.message }}</mat-error>
    </mat-form-field>
  </div>
</adm-section-card>

<h2 mat-dialog-title>Admin létrehozva: {{ data.username }}</h2>
<mat-dialog-content>
  <mat-form-field class="w-full">
    <mat-label>Jelszó</mat-label>
    <input class="adm-password" matInput readonly [value]="data.password" />
    <button
      aria-label="Jelszó másolása"
      matIconButton
      matSuffix
      type="button"
      [cdkCopyToClipboard]="data.password"
      (cdkCopyToClipboardCopied)="onCopied($event)"
    >
      <mat-icon>content_copy</mat-icon>
    </button>
  </mat-form-field>

  <p class="flex items-start gap-2 m-0">
    <mat-icon aria-hidden="true">warning</mat-icon>
    <span>Ez a jelszó csak most látható. Másold ki, és add át biztonságos csatornán.</span>
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-dialog-close matButton="filled" type="button">Bezárás</button>
</mat-dialog-actions>

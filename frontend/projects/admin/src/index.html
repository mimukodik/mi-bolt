<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <title>MiBolt Admin</title>
    <base href="/" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
    <!-- Cover screen until the first navigation settles; App removes it after its exit animation (MIM-404). -->
    <style>
      #mi-bolt-splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f9f9ff;
        color: #001b3f;
        font:
          500 16px/1.3 Roboto,
          ui-sans-serif,
          system-ui,
          'Segoe UI',
          Arial,
          sans-serif;
      }
      #mi-bolt-splash .splash__mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #005cbb;
        color: #ffffff;
        font-size: 32px;
        font-weight: 700;
        box-shadow: 0 8px 20px rgba(0, 92, 187, 0.25);
      }
      #mi-bolt-splash .splash__label {
        margin: 0;
        letter-spacing: 0.01em;
      }
      #mi-bolt-splash .splash__track {
        position: relative;
        width: 160px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: #d7e3ff;
      }
      #mi-bolt-splash .splash__bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: 2px;
        background: #005cbb;
        transform: translateX(-100%);
        animation: adm-splash-progress 1.2s ease-in-out infinite;
      }
      #mi-bolt-splash.splash--leaving {
        animation: adm-splash-leave 200ms ease-in forwards;
        pointer-events: none;
      }
      @keyframes adm-splash-progress {
        to {
          transform: translateX(250%);
        }
      }
      @keyframes adm-splash-leave {
        to {
          opacity: 0;
          transform: scale(0.98);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #mi-bolt-splash,
        #mi-bolt-splash * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <adm-root></adm-root>
    <div id="mi-bolt-splash">
      <div class="splash__mark">M</div>
      <p class="splash__label">MiBolt Admin</p>
      <div class="splash__track"><span class="splash__bar"></span></div>
    </div>
  </body>
</html>

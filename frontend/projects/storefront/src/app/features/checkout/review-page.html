@if (cartFacade.cart(); as cart) {
  @if (checkoutFacade.session(); as session) {
    <app-review-step
      [cart]="cart"
      [draft]="session"
      [intentDropped]="checkoutFacade.intentDropped()"
      [options]="checkoutFacade.options()"
      [paymentIntent]="checkoutFacade.paymentIntent()"
      [paymentIntentMissing]="paymentIntentMissing()"
      [paymentPoll]="paymentPoll()"
      [paymentStarted]="paymentStarted"
      [priceChange]="checkoutFacade.priceChange()"
      [state]="viewState()"
      [summary]="checkoutFacade.summary()"
      (backToCartRequested)="onBackToCart()"
      (backToPaymentRequested)="onBackToPayment()"
      (editRequested)="onEditRequested($event)"
      (newPaymentRequested)="onNewPayment()"
      (paymentChangeMethodRequested)="onPaymentChangeMethod()"
      (paymentCheckRequested)="onPaymentCheck()"
      (paymentRetryRequested)="onPaymentRetry()"
      (priceChangeConfirmed)="onPriceChangeConfirmed()"
      (retryRequested)="onRetryRequested()"
      (submitRequested)="onSubmitRequested()"
    />

    @if (submitFailure(); as failure) {
      <div
        class="submit-failure"
        data-testid="review-submit-failure"
        [attr.data-error-code]="failure.code"
      >
        <app-status-message severity="error" [message]="submitFailureMessage" [persistent]="true" />
        <app-button
          data-testid="review-change-payment"
          label="Fizetési mód módosítása"
          variant="secondary"
          (pressed)="onPaymentChangeMethod()"
        />
      </div>
    }
  } @else {
    <div appSkeletonLeave class="loading" data-testid="review-loading">
      <app-loading-state label="Rendelés adatainak betöltése" variant="lines" />
    </div>
  }
} @else {
  <div appSkeletonLeave class="loading" data-testid="review-loading">
    <app-loading-state label="Kosár betöltése" variant="lines" />
  </div>
}

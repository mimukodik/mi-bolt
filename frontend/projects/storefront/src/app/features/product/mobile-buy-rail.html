<aside aria-label="Kosárba helyezés" class="rail" data-testid="purchase-rail">
  @if (error(); as problem) {
    <div class="rail-status">
      <app-status-message
        severity="error"
        [message]="problem.message"
        (dismissed)="onErrorDismissed()"
      />
    </div>
  } @else if (success(); as message) {
    <div class="rail-status">
      <app-status-message
        severity="success"
        [message]="message"
        (dismissed)="onSuccessDismissed()"
      />
    </div>
  }
  <div class="rail-row flex items-center gap-(--space-4)">
    <div class="rail-price">
      <app-price-block
        label="Készülékár"
        [money]="money()"
        [promotionText]="promotionText()"
        [referencePrice]="referencePrice()"
        [status]="priceStatus()"
      />
    </div>
    <div class="rail-cta">
      <app-button
        data-testid="purchase-cta"
        label="Kosárba teszem"
        loadingLabel="Hozzáadás…"
        variant="primary"
        [disabled]="!available() || pending()"
        [loading]="pending()"
        (pressed)="onPress()"
      />
    </div>
  </div>
  @if (visibleReason(); as text) {
    <p
      class="m-0 text-right text-(length:--type-helper) text-(--color-text-secondary)"
      data-testid="purchase-rail-reason"
      role="status"
    >
      {{ text }}
    </p>
  }
</aside>

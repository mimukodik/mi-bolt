<div
  class="root relative block w-full rounded overflow-hidden"
  [attr.aria-label]="decorative() ? null : image().alt"
  [attr.data-status]="status()"
  [attr.role]="decorative() ? null : 'img'"
  [style.aspect-ratio]="aspectRatio()"
>
  @if (status() === 'error') {
    <div
      aria-hidden="true"
      class="fallback absolute inset-0 flex items-center justify-center"
      data-testid="image-fallback"
    >
      <span class="fallback-mark font-bold tracking-wider">{{ initial() }}</span>
    </div>
  } @else {
    <!-- The photo element is in the DOM while loading too, because the
         browser only fetches an image it can see; the skeleton is laid
         over it until the `load` event arrives. -->
    <img
      class="photo object-contain"
      data-testid="image-photo"
      decoding="async"
      [alt]="decorative() ? '' : image().alt"
      [attr.loading]="eager() ? 'eager' : 'lazy'"
      [src]="resolvedSrc()"
      (error)="onError()"
      (load)="onLoad()"
    />
    @if (status() === 'loading') {
      <span
        appSkeletonLeave
        aria-hidden="true"
        class="skeleton absolute inset-0"
        data-testid="image-skeleton"
      ></span>
    }
  }
  @if (!decorative()) {
    <span class="sr-only absolute w-px h-px overflow-hidden">{{ image().alt }}</span>
  }
</div>

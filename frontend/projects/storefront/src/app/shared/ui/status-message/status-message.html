<div
  class="root flex items-center justify-between gap-3 px-4 py-3 rounded"
  data-testid="status-message"
  [attr.aria-live]="live() ? (severity() === 'error' ? 'assertive' : 'polite') : null"
  [attr.role]="live() ? (severity() === 'error' ? 'alert' : 'status') : null"
  [class.is-error]="severity() === 'error'"
  [class.is-info]="severity() === 'info'"
  [class.is-success]="severity() === 'success'"
  [class.is-warning]="severity() === 'warning'"
>
  <p class="message m-0">{{ message() }}</p>
  @if (!persistent()) {
    <div class="actions inline-flex items-center">
      <app-button label="Bezárás" variant="secondary" (pressed)="dismissed.emit()" />
    </div>
  }
</div>

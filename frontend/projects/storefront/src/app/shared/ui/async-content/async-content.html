<div class="grid" data-testid="catalog-grid" [class.grid--refreshing]="isRefreshing()">
  @if (status() === 'empty') {
    <div class="state state--empty" data-testid="catalog-empty">
      <app-empty-state
        message="Próbáld meg kevesebb szűrővel, vagy töröld az aktív szűrőket."
        title="Nincs a szűrőknek megfelelő készülék."
      />
      <ng-content select="[data-async-empty-action]" />
    </div>
  } @else if (status() === 'error') {
    <div class="state state--error" data-testid="catalog-error">
      <app-error-state
        title="Nem sikerült betölteni a katalógust."
        [message]="errorMessage()"
        [preserving]="hasPrevious()"
        (retryRequested)="retryRequested.emit()"
      />
    </div>
  } @else if (status() === 'loading' && !hasPrevious()) {
    <div appSkeletonLeave class="state state--loading" data-testid="catalog-loading">
      <app-loading-state label="Katalógus betöltése" variant="card" />
    </div>
  } @else {
    <!-- success, or loading with hasPrevious (refreshing): the caller's
         projected content stays on screen. A single unconditional
         `<ng-content>` is deliberate — Angular only ever fills one of
         several same-selector `<ng-content>` outlets when more than one
         is present in a template, so the two cases share this one. -->
    @if (isRefreshing()) {
      <span class="sr-only" role="status">Frissítés folyamatban…</span>
    }
    <ng-content />
  }
</div>

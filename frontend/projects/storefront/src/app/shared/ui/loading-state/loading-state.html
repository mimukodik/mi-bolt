<div
  class="root flex flex-col gap-3"
  data-testid="loading-state"
  [attr.aria-busy]="true"
  [attr.aria-label]="label()"
  [attr.role]="role()"
  [class.is-card]="variant() === 'card'"
  [class.is-lines]="variant() === 'lines'"
>
  @switch (variant()) {
    @case ('lines') {
      <span aria-hidden="true" class="line line--wide block"></span>
      <span aria-hidden="true" class="line line--medium block"></span>
      <span aria-hidden="true" class="line line--narrow block"></span>
    }
    @case ('card') {
      <span aria-hidden="true" class="block block--image block"></span>
      <span aria-hidden="true" class="block block--title block"></span>
      <span aria-hidden="true" class="block block--price block"></span>
    }
    @default {
      <span aria-hidden="true" class="block block--single block"></span>
    }
  }
  <span class="sr-only absolute w-px h-px overflow-hidden">{{ label() }}</span>
</div>

name: Start Bolt Preview Smoke

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.event.label.name == 'bolt-preview' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Dispatch smoke for the current published head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/candidate/preview_smoke.py dispatch

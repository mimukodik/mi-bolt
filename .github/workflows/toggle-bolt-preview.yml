name: Toggle Bolt Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository pull request number
        required: true
        type: string
      state:
        description: Enable or disable the hosted preview
        required: true
        type: choice
        options: [enable, disable]

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: bolt-preview-toggle-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR and set preview label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PREVIEW_STATE: ${{ inputs.state }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid PR number'; exit 1; }
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          [[ "$(jq -r '.state' <<< "$pr")" == open ]] || { echo 'PR is closed'; exit 1; }
          [[ "$(jq -r '.head.repo.full_name' <<< "$pr")" == "$GITHUB_REPOSITORY" ]] || { echo 'Fork PR is not eligible'; exit 1; }
          if [[ "$PREVIEW_STATE" == enable ]]; then
            echo 'Enabling Bolt preview label'
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f 'labels[]=bolt-preview' >/dev/null
          elif [[ "$PREVIEW_STATE" == disable ]]; then
            echo 'Disabling Bolt preview label'
            if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -Fxq bolt-preview; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/bolt-preview" >/dev/null
            fi
          else
            echo 'Invalid preview state'
            exit 1
          fi

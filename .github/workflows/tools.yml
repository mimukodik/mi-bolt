name: Tools

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Tools typecheck and tests
    # Blacksmith runner, same label as the other workflows; Ubuntu 24.04 is pinned in the label.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: tools
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - run: npm ci
        timeout-minutes: 5
      - name: Typecheck
        timeout-minutes: 3
        run: npm run typecheck
      - name: Tests
        timeout-minutes: 5
        run: npm test

name: Contracts

on:
  workflow_call:
  pull_request:
    branches: [main, eggprojec/mim-210-s1-sdk, eggprojec/mim-296-admin]

permissions:
  contents: read

jobs:
  check:
    name: Contract checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12
          install: false
      - name: Install the contract tools
        run: mise -C contracts install
      - name: OpenAPI lint, samples, sequences
        run: mise -C contracts run check

name: Backend PR check

on:
  pull_request:
    branches: [main, eggprojec/mim-296-admin]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    # Blacksmith runner (docs.blacksmith.sh quickstart, read 2026-09-19); the Ubuntu 24.04 image is pinned in the label.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        timeout-minutes: 3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
        timeout-minutes: 3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        timeout-minutes: 5
      - name: Run unit tests
        run: ./gradlew test
        timeout-minutes: 8
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-unit
          path: backend/services/commerce/build/jacoco/test.exec
          if-no-files-found: error
          overwrite: true
        timeout-minutes: 5
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            backend/services/commerce/build/reports/tests/test/
            backend/services/commerce/build/test-results/test/
          overwrite: true
        timeout-minutes: 5

  integration-tests:
    name: Integration tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        timeout-minutes: 3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
        timeout-minutes: 3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        timeout-minutes: 5
      - name: Run integration tests
        run: ./gradlew integrationTest
        timeout-minutes: 10
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-integration
          path: backend/services/commerce/build/jacoco/integrationTest.exec
          if-no-files-found: error
          overwrite: true
        timeout-minutes: 5
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: |
            backend/services/commerce/build/reports/tests/integrationTest/
            backend/services/commerce/build/test-results/integrationTest/
          overwrite: true
        timeout-minutes: 5

  lint:
    name: Lint (PMD)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        timeout-minutes: 3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
        timeout-minutes: 3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        timeout-minutes: 5
      - name: Run PMD
        run: ./gradlew pmdMain pmdTest
        timeout-minutes: 8
      - name: Upload PMD reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pmd-reports
          path: backend/services/commerce/build/reports/pmd/
          overwrite: true
        timeout-minutes: 5

  coverage-gate:
    name: Coverage gate and build
    needs: [unit-tests, integration-tests]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        timeout-minutes: 3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
        timeout-minutes: 3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        timeout-minutes: 5
      - name: Download coverage data
        uses: actions/download-artifact@v7
        with:
          pattern: jacoco-*
          path: backend/services/commerce/build/jacoco
          merge-multiple: true
        timeout-minutes: 5
      - name: Check coverage data is present
        run: test -s services/commerce/build/jacoco/test.exec && test -s services/commerce/build/jacoco/integrationTest.exec
        timeout-minutes: 2
      - name: Coverage gate and build
        run: ./gradlew build jacocoTestReport -x test -x integrationTest --continue
        timeout-minutes: 8
      - name: Upload coverage report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: backend/services/commerce/build/reports/jacoco/
          if-no-files-found: error
          overwrite: true
        timeout-minutes: 5

  postgres-smoke:
    name: PostgreSQL boot and smoke
    needs: [unit-tests, integration-tests, lint]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: backend/services/commerce
    timeout-minutes: 15
    env:
      # CI-only throwaway, like POSTGRES_PASSWORD below; the policy needs 15 or more characters (ADR 0016).
      MIBOLT_ADMIN_INITIAL_PASSWORD: ci-smoke-admin-password
    # docs/02 §7.0 exception, docs/decisions/0013: the tests stay on H2; this
    # job boots the built jar on an empty PostgreSQL 16 and runs scripts/smoke.sh.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mi_bolt
          POSTGRES_PASSWORD: mi_bolt_local
          POSTGRES_DB: mi_bolt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
        timeout-minutes: 3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
        timeout-minutes: 3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        timeout-minutes: 5
      - name: Build the jar
        run: ./gradlew bootJar
        working-directory: backend
        timeout-minutes: 8
      - name: Start the application on PostgreSQL
        env:
          MIBOLT_DB_URL: jdbc:postgresql://localhost:5432/mi_bolt
        run: |
          nohup java -jar build/libs/commerce-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -qE 'catalogue (loaded|present)' app.log && break
            sleep 2
          done
          grep -E 'catalogue (loaded|present)' app.log
          curl -sf --max-time 30 -o /dev/null http://localhost:8080/api/v1/products
        timeout-minutes: 5
      - name: Smoke pass
        run: bash scripts/smoke.sh
        timeout-minutes: 5
      - name: Upload application log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-smoke-app-log
          path: backend/services/commerce/app.log
          overwrite: true
        timeout-minutes: 5

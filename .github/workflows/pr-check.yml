name: PR check

on:
  pull_request:
    branches: [main, eggprojec/mim-210-s1-sdk]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    # Blacksmith runner, same label as the backend workflow; Ubuntu 24.04 is pinned in the label.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  unit-tests:
    name: Unit tests and coverage
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Vitest with coverage
        run: npm run test
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs coverage/unit/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage summary (demo-payment)
        if: always()
        run: node scripts/coverage-summary.mjs coverage/demo-payment/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: |
            coverage/unit/
            coverage/demo-payment/
          if-no-files-found: error
          overwrite: true

  build:
    name: Production build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:payment

  api-drift:
    name: API client drift
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Regenerate and diff
        run: npm run api:drift

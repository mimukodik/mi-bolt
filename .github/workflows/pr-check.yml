name: PR check

on:
  pull_request:
    branches: [main, eggprojec/mim-210-s1-sdk, eggprojec/mim-296-admin]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    # Blacksmith runner, same label as the backend workflow; Ubuntu 24.04 is pinned in the label.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        timeout-minutes: 5
      - name: ESLint
        timeout-minutes: 3
        run: npm run lint
      - name: Prettier
        timeout-minutes: 3
        run: npm run format:check

  unit-tests:
    name: Unit tests and coverage
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        timeout-minutes: 5
      - name: Vitest with coverage
        timeout-minutes: 8
        run: npm run test
      - name: Contract specs (tests/contract)
        timeout-minutes: 3
        run: npm run test:contract
      - name: Coverage summary
        if: always()
        timeout-minutes: 2
        run: node scripts/coverage-summary.mjs coverage/unit/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage summary (demo-payment)
        if: always()
        timeout-minutes: 2
        run: node scripts/coverage-summary.mjs coverage/demo-payment/coverage-summary.json '### Demo-payment coverage' >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage summary (admin)
        if: always()
        timeout-minutes: 2
        run: node scripts/coverage-summary.mjs coverage/admin/coverage-summary.json '### Admin coverage' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: |
            frontend/coverage/unit/
            frontend/coverage/demo-payment/
            frontend/coverage/admin/
          if-no-files-found: error
          overwrite: true

  build:
    name: Production build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        timeout-minutes: 5
      - run: npm run build:check
        timeout-minutes: 5
      - run: npm run build:payment
        timeout-minutes: 5
      - run: npm run build:admin
        timeout-minutes: 5
      - run: npm run check:admin-dist
      - run: npm run check:payment-boot
        timeout-minutes: 6
      - run: npm run check:admin-boot
        timeout-minutes: 6

  api-drift:
    name: API client drift
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        timeout-minutes: 5
      - name: Regenerate and diff
        timeout-minutes: 5
        run: npm run api:drift

  e2e:
    name: E2E ${{ matrix.project }}
    # Skipped deliberately: the suite has no tests yet, so the coverage gate
    # would fail on an empty denominator. The user asked on 2026-09-22 for the
    # job to exist and be skipped. Remove the `if: false` lines on both jobs
    # when the first spec under e2e/integration/ lands.
    if: false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              project: integration-chromium-fullhd,
              browser: chromium,
              gate: '1',
              seed: '--project=seed',
            }
          - { project: integration-chromium-mobile, browser: chromium, gate: '1', seed: '' }
          - { project: integration-firefox-fullhd, browser: firefox, gate: '0', seed: '' }
          - { project: integration-firefox-mobile, browser: firefox, gate: '0', seed: '' }
          - { project: integration-webkit-fullhd, browser: webkit, gate: '0', seed: '' }
          - { project: integration-webkit-mobile, browser: webkit, gate: '0', seed: '' }
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        timeout-minutes: 5
      - name: Install ${{ matrix.browser }}
        timeout-minutes: 10
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build (development configuration, mock worker on)
        timeout-minutes: 5
        run: npx ng build --configuration development
      - name: Playwright ${{ matrix.project }}
        timeout-minutes: 12
        run: npx playwright test ${{ matrix.seed }} --project=${{ matrix.project }}
        env:
          CI: 'true'
          E2E_COVERAGE_GATE: ${{ matrix.gate }}
      - name: Coverage summary (e2e, ${{ matrix.project }})
        if: always() && matrix.gate == '1'
        timeout-minutes: 3
        run: node scripts/coverage-summary.mjs coverage/e2e/coverage/coverage-summary.json '### E2E coverage (${{ matrix.project }})' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload blob report
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.project }}
          path: frontend/blob-report
          retention-days: 1
          if-no-files-found: error
      - name: Upload coverage and traces
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-${{ matrix.project }}
          path: |
            frontend/coverage/e2e/
            frontend/test-results/
          if-no-files-found: ignore
          overwrite: true

  e2e-report:
    name: E2E merged report
    if: false
    needs: [e2e]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: frontend
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        timeout-minutes: 5
      - uses: actions/download-artifact@v7
        timeout-minutes: 5
        with:
          path: frontend/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge the six HTML reports into one
        timeout-minutes: 5
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report
          if-no-files-found: error
          overwrite: true

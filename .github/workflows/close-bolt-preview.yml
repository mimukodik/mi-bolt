name: Deactivate Bolt Preview Deployment

on:
  pull_request_target:
    types: [closed, unlabeled]

permissions:
  contents: read
  pull-requests: read
  deployments: write

jobs:
  close:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || github.event.label.name == 'bolt-preview')
    runs-on: ubuntu-latest
    concurrency:
      group: bolt-preview-${{ github.event.pull_request.number }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Mark preview inactive in GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 deploy/candidate/github_deployment.py inactive "$PR_NUMBER"

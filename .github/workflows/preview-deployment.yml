name: Preview Deployment

# Shows a labelled PR's Bolt preview as a GitHub deployment on the PR (MIM-505).
# The Berek coordinator deploys previews with a read-only GitHub token, so this
# reports for it: in progress when the preview label goes on or a labelled PR
# gets a push, the preview URL once it serves the head, inactive when the label
# goes or the PR closes. A dispatch reports a preview that is already running.
# pull_request_target runs the default branch's copy and nothing here checks
# out PR code.
on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request whose preview to report
        type: number
        required: true

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.state == 'open' &&
       ((github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        (github.event.action == 'synchronize' &&
         contains(github.event.pull_request.labels.*.name, 'preview'))))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 50
    # Job-level, so an unrelated label event skips without cancelling: a push,
    # the label going or the PR closing supersedes the wait in progress.
    concurrency:
      group: preview-deployment-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report the preview once it serves the head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        # exec: a cancel signals the reporter itself, which marks the deployment inactive.
        run: exec python3 deploy/candidate/github_deployment.py report "$PR_NUMBER"

  deactivate:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.action == 'closed' &&
        contains(github.event.pull_request.labels.*.name, 'preview')) ||
       (github.event.action == 'unlabeled' && github.event.label.name == 'preview'))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    concurrency:
      group: preview-deployment-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mark the preview's deployments inactive
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 deploy/candidate/github_deployment.py inactive "$PR_NUMBER"

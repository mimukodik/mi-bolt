const money=n=>new Intl.NumberFormat('hu-HU').format(n)+' Ft',escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={screen:'home',state:'default',product:0,variant:0,view:'front',qty:1,cart:[],search:'',brand:'all',only5g:false,stock:false,storage:'',min:'',max:'',sort:'recommended',page:1,pageSize:12,contact:{name:'',email:'',phone:''},delivery:'home_delivery',payment:'demo_cod',address:{zip:'',city:'',street:''},consentA:false,consentB:false,errors:false,receipt:null};
const stateOptions={home:[['default','Alapállapot'],['loading','Betöltés'],['error','Kiemeltek: hiba']],catalogue:[['default','Alapállapot'],['loading','Betöltés'],['empty','Nincs találat'],['error','Hálózati hiba']],product:[['default','Alapállapot'],['loading','Betöltés'],['unavailable','Elfogyott variáns'],['error','Hálózati hiba'],['image-error','Képhiba']],cart:[['default','Teli kosár'],['empty','Üres kosár'],['error','Módosítási hiba']],contact:[['default','Alapállapot'],['invalid','Hibás adatok'],['error','Mentési hiba']],delivery:[['default','Alapállapot'],['error','Mentési hiba']],review:[['default','Alapállapot'],['submitting','Feldolgozás'],['declined','Fizetés elutasítva'],['expired','Lejárt összesítés'],['price-changed','Megváltozott ár']],success:[['default','Demó visszaigazolás'],['error','Lekérdezési hiba']]};
const p=()=>PRODUCTS[S.product],v=()=>p().variants[S.variant]||p().defaultVariant;
function img(variant,view='front',cls='',alt=''){return `<img class="${cls}" src="${MEDIA[variant.colorCode+'-'+view]}" width="320" height="400" alt="${escapeHtml(alt||variant.colorName+' színű demókészülék – '+(view==='front'?'elölnézet':'hátulnézet'))}">`}
function go(screen,state='default'){S.state=state;const h='#/'+screen+(state!=='default'?'?state='+state:'');if(location.hash===h)render();else location.hash=h;window.scrollTo(0,0)}
function route(){const h=location.hash.slice(2).split('?');S.screen=stateOptions[h[0]]?h[0]:'home';S.state=new URLSearchParams(h[1]||'').get('state')||'default';render()}
function count(){return S.cart.reduce((n,l)=>n+l.qty,0)}function subtotal(){return S.cart.reduce((n,l)=>n+PRODUCTS[l.p].variants[l.v].price.amount*l.qty,0)}function fee(){return S.delivery==='home_delivery'?1990:0}
function demoCart(){if(!S.cart.length)S.cart=[{p:0,v:0,qty:1}]}
function brand(){return '<a href="#/home" class="brand" aria-label="MiBolt főoldal">Mi<span>Bolt</span></a>'}
function header(compact=false){return `<header class="app-header ${compact?'compact':''}"><div class="container header-row">${!compact?'<button class="icon-button mobile-menu" data-action="menu" aria-label="Menü megnyitása">☰</button>':''}${brand()}${compact?'<span class="checkout-caption">Demó pénztár</span><a class="back-link" href="#/catalogue">← Vissza a telefonokhoz</a>':`<nav class="nav" aria-label="Fő navigáció"><a href="#/catalogue" class="${S.screen==='catalogue'?'active':''}">Mobiltelefonok</a><a href="#" data-action="info">A demóról</a></nav><form class="header-search" id="header-search"><input id="global-search" name="q" aria-label="Telefon keresése" placeholder="Milyen telefont keresel?" value="${escapeHtml(S.search)}"><button class="icon-button" aria-label="Keresés">⌕</button></form><a class="cart-link" href="#/cart" aria-label="Kosár, ${count()} termék">▱ <span>Kosár</span> <span class="badge">${count()}</span></a>`}</div></header><div class="demo-strip"><div class="container"><span class="tag">DEMÓ</span>Fiktív termékek és árak. A vásárlás szimulált; nem történik valódi fizetés.</div></div>`}
function footer(){return `<footer class="footer"><div class="container footer-row">${brand()}<p>Mobilválasztás egyszerűen. Ez egy bemutató webshop: minden termék, ár és rendelés demóadat.</p><button data-action="info" class="small">Hogyan működik a demó?</button></div></footer>`}
function card(prod,index){const x=prod.defaultVariant;return `<article class="product-card"><a href="#/product" class="card-media" data-product="${index}" data-variant="${x.id}" aria-label="${escapeHtml(prod.name)} megtekintése"><span class="tag">DEMÓTERMÉK</span>${img(x)}</a><div class="card-body"><h3><a href="#/product" data-product="${index}" data-variant="${x.id}">${escapeHtml(prod.name)}</a></h3><p>${escapeHtml(prod.highlights.join(' · '))}</p><div class="variantline"><span class="dot" style="background:${x.swatchHex}"></span>${x.storageGb} GB · ${escapeHtml(x.colorName)}</div><div class="price">${money(x.price.amount)}</div><div class="metadata">Egyszeri készülékár · demóadat</div><a class="btn outline" href="#/product" data-product="${index}" data-variant="${x.id}">Részletek <span aria-hidden="true">→</span></a></div></article>`}
function skeletons(n){return `<div class="grid">${Array.from({length:n},()=>'<div class="skeleton-wrap" aria-hidden="true"><div class="skeleton big"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton price-skeleton"></div></div>').join('')}</div><p role="status" class="small muted">Készülékek betöltése…</p>`}
function error(title,text){return `<div class="notice error" role="alert"><strong>${title}</strong>${text}<div style="margin-top:12px"><button data-action="retry">Újrapróbálom</button></div></div>`}
function home(){return `${header()}<main id="main"><section class="hero"><div class="container hero-grid"><div><p class="eyebrow">MIBOLT · MOBILTELEFONOK</p><h1>A következő mobilod.<br><span>Egyszerűen.</span></h1><p>Találd meg a hozzád illő készüléket, válaszd ki a kedvenced, és próbáld ki a rendelést demó módban.</p><div class="hero-actions"><a class="btn primary" href="#/catalogue">Megnézem a telefonokat <span aria-hidden="true">→</span></a><button class="secondary" data-action="how">Hogyan működik?</button></div></div><div class="hero-art">${img(PRODUCTS[0].variants.find(x=>x.colorCode==='silver'),'back','back')}${img(PRODUCTS[0].defaultVariant,'front','front')}<small>Illusztráció · nem valódi termékajánlat</small></div></div></section><div class="container shortcuts"><a class="shortcut" href="#/catalogue" data-shortcut="all"><span class="shortcut-icon" aria-hidden="true">▯</span><span><strong>Összes telefon</strong><small>Válassz a készülékek közül</small></span><span class="arrow">→</span></a><a class="shortcut" href="#/catalogue" data-shortcut="5g"><span class="shortcut-icon" aria-hidden="true">5G</span><span><strong>5G készülékek</strong><small>Fedezd fel a demó kínálatot</small></span><span class="arrow">→</span></a><a class="shortcut" href="#/catalogue" data-shortcut="stock"><span class="shortcut-icon" aria-hidden="true">□</span><span><strong>Raktáron</strong><small>Elérhető a demó készletben</small></span><span class="arrow">→</span></a></div><section class="section container"><div class="section-head"><h2>Készülékek, amiket érdemes megnézni</h2><a href="#/catalogue">Minden telefon →</a></div>${S.state==='loading'?skeletons(4):S.state==='error'?error('Most nem érhetők el a kiemelt készülékek.','A teljes kínálatot továbbra is megnyithatod.'): `<div class="grid">${PRODUCTS.slice(0,4).map(card).join('')}</div>`}</section><section class="section how" id="how"><div class="container"><div class="section-head"><h2>Három lépés. Egy új kedvenc.</h2><span class="metadata">Így működik a demó</span></div><div class="how-grid"><div class="how-card"><span class="number">01</span><h3>Válaszd ki a készüléked</h3><p>Szűrj a számodra fontos tulajdonságokra, és nézd meg közelebbről a telefonokat.</p></div><div class="how-card"><span class="number">02</span><h3>Állítsd össze a rendelést</h3><p>Válassz színt és tárhelyet. A pénztárban kizárólag tesztadatokat adj meg.</p></div><div class="how-card"><span class="number">03</span><h3>Próbáld végig a folyamatot</h3><p>A végén demó visszaigazolást kapsz. Nem történik valódi fizetés vagy kézbesítés.</p></div></div></div></section></main>${footer()}`}
function filters(){const brands=[...new Set(PRODUCTS.map(x=>x.brand))];return `<div class="filters"><h2>Szűrők</h2><div class="filter-group"><label class="field">Keresés<input name="search" value="${escapeHtml(S.search)}" placeholder="Név vagy márka" aria-label="Szűrés név vagy márka alapján"></label></div><fieldset class="filter-group"><legend>Márka</legend>${brands.map(b=>`<label class="check"><input type="checkbox" name="brand" value="${escapeHtml(b)}" ${S.brand.split('|').includes(b)?'checked':''}>${escapeHtml(b)}<small>${PRODUCTS.filter(x=>x.brand===b).length}</small></label>`).join('')}</fieldset><fieldset class="filter-group"><legend>Tárhely</legend>${[128,256,512].map(n=>`<label class="check"><input type="radio" name="storage" value="${n}" ${S.storage==n?'checked':''}>${n} GB</label>`).join('')}<label class="check"><input type="radio" name="storage" value="" ${!S.storage?'checked':''}>Mindegy</label></fieldset><fieldset class="filter-group"><legend>Készülékár</legend><div class="field-grid"><label class="field">Minimum (Ft)<input type="number" name="min" min="0" value="${S.min}" placeholder="0"></label><label class="field">Maximum (Ft)<input type="number" name="max" min="0" value="${S.max}" placeholder="500000"></label></div></fieldset><fieldset class="filter-group"><legend class="sr-only">Elérhetőség</legend><label class="check"><input type="checkbox" name="only5g" ${S.only5g?'checked':''}>5G készülék</label><label class="check"><input type="checkbox" name="stock" ${S.stock?'checked':''}>Csak raktáron</label></fieldset></div>`}
function filtered(){let a=PRODUCTS.map((x,i)=>{const matches=x.variants.filter(z=>(!S.storage||z.storageGb==S.storage)&&(!S.stock||z.availability==='in_stock')&&(!S.min||z.price.amount>=+S.min)&&(!S.max||z.price.amount<=+S.max)).sort((a,b)=>a.price.amount-b.price.amount);return {...x,index:i,defaultVariant:matches.find(z=>z.id===x.defaultVariant.id)||matches[0],hasMatch:matches.length>0}}).filter(x=>x.hasMatch&&(x.name+' '+x.brand).toLocaleLowerCase('hu').includes(S.search.toLocaleLowerCase('hu'))&&(S.brand==='all'||S.brand.split('|').includes(x.brand))&&(!S.only5g||x.is5g));if(S.sort==='price-asc')a.sort((a,b)=>a.defaultVariant.price.amount-b.defaultVariant.price.amount);if(S.sort==='price-desc')a.sort((a,b)=>b.defaultVariant.price.amount-a.defaultVariant.price.amount);if(S.sort==='name')a.sort((a,b)=>a.name.localeCompare(b.name));return a}
function catalogue(){let a=filtered();if(S.state==='empty')a=[];const pages=Math.max(1,Math.ceil(a.length/S.pageSize));S.page=Math.min(S.page,pages);return `${header()}<main class="container page" id="main"><div class="breadcrumb"><a href="#/home">Főoldal</a><span>/</span><span>Mobiltelefonok</span></div><div class="page-intro"><h1>Mobiltelefonok</h1><p>Találd meg a neked megfelelő készüléket. Az árak egyszeri, fiktív demóárak.</p></div><div class="catalogue"><aside class="desktop-filters" aria-label="Termékszűrők">${filters()}</aside><section aria-label="Találatok"><div class="toolbar"><span class="count">${a.length} készülék</span><button class="filter-button" data-action="filters">☷ Szűrők</button><label>Rendezés <select id="sort"><option value="recommended">Ajánlott sorrend</option><option value="price-asc">Ár szerint növekvő</option><option value="price-desc">Ár szerint csökkenő</option><option value="name">Név szerint</option></select></label><label class="page-size">Oldalanként <select id="page-size"><option value="12">12</option><option value="24">24</option></select></label></div>${[S.search,S.brand!=='all',S.only5g,S.stock,S.storage,S.min,S.max].some(Boolean)?`<div class="chips">${S.search?`<span class="chip">„${escapeHtml(S.search)}”</span>`:''}${S.brand!=='all'?`<span class="chip">${escapeHtml(S.brand.split('|').join(' · '))}</span>`:''}${S.only5g?'<span class="chip">5G</span>':''}${S.stock?'<span class="chip">Raktáron</span>':''}${S.storage?`<span class="chip">${S.storage} GB</span>`:''}<button class="text-button" data-action="clear-filters">Szűrők törlése</button></div>`:''}${S.min&&S.max&&+S.min>+S.max?error('Hibás ártartomány','A minimum nem lehet nagyobb a maximumnál.'):S.state==='loading'?skeletons(6):S.state==='error'?error('Most nem tudtuk betölteni a készülékeket.','A beállított szűrők megmaradtak. Próbáld újra.'):!a.length?'<div class="empty-state"><div class="empty-symbol" aria-hidden="true">⌕</div><h2>Nincs ilyen készülék a kínálatban.</h2><p>Módosíts a keresésen, vagy töröld a szűrőket, és nézd meg az összes demótelefont.</p><button class="primary" data-action="clear-filters">Szűrők törlése</button></div>':`<div class="grid">${a.slice((S.page-1)*S.pageSize,S.page*S.pageSize).map(x=>card(x,x.index)).join('')}</div><nav class="pagination" aria-label="Lapozás">${Array.from({length:pages},(_,i)=>`<button class="icon-button ${S.page===i+1?'selected':''}" data-page="${i+1}" aria-label="${i+1}. oldal" ${S.page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}</nav>`}</section></div></main>${footer()}`}
function product(){const prod=p(),variant=v(),colors=[...new Map(prod.variants.map(x=>[x.colorCode,x])).values()],storages=[...new Set(prod.variants.map(x=>x.storageGb))],unavailable=S.state==='unavailable'||variant.availability!=='in_stock';return `${header()}<main class="container page product-page" id="main"><div class="breadcrumb"><a href="#/home">Főoldal</a><span>/</span><a href="#/catalogue">Mobiltelefonok</a><span>/</span><span>${prod.name}</span></div>${S.state==='error'?error('A készülék adatait most nem tudtuk betölteni.','Próbáld újra. Nem jelenítünk meg kitalált árat vagy készletet.'):S.state==='loading'?skeletons(2):`<div class="product-main"><section aria-label="Termékgaléria"><div class="gallery-stage">${S.state==='image-error'?'<div class="empty-state" style="border:0;background:transparent"><h3>A kép most nem érhető el.</h3><p>A készülék adatai továbbra is megtekinthetők.</p></div>':img(variant,S.view)}<button class="icon-button previous" data-action="gallery-prev" aria-label="Előző termékkép">←</button><button class="icon-button next" data-action="gallery-next" aria-label="Következő termékkép">→</button><button class="icon-button zoom" data-action="zoom" aria-label="Termékkép nagyítása">⌕</button><span class="caption">Fiktív termék illusztrációja · ${S.view==='front'?'1':'2'}/2</span></div><div class="thumbs"><button class="thumb ${S.view==='front'?'selected':''}" data-view="front" aria-label="Elölnézet" aria-pressed="${S.view==='front'}">${img(variant,'front')}</button><button class="thumb ${S.view==='back'?'selected':''}" data-view="back" aria-label="Hátulnézet" aria-pressed="${S.view==='back'}">${img(variant,'back')}</button></div><p class="metadata">A képek fiktív demókészüléket mutatnak. Valós márkát és terméket nem ábrázolnak.</p></section><section class="product-info"><p class="eyebrow">DEMÓTERMÉK · ${prod.is5g?'5G':'4G'}</p><h1>${prod.name}</h1><p class="muted small">${prod.description}</p><div class="stock ${unavailable?'error':''}" role="status">${unavailable?'× Ez a konfiguráció elfogyott a demó készletből.':'✓ Raktáron a demó készletben'}</div><div class="choice-group"><span class="choice-label">Szín: <strong>${variant.colorName}</strong></span><div class="choices">${colors.map(x=>`<button class="choice ${variant.colorCode===x.colorCode?'selected':''}" data-color="${x.colorCode}" aria-pressed="${variant.colorCode===x.colorCode}"><span class="swatch" style="background:${x.swatchHex}"></span>${x.colorName}${variant.colorCode===x.colorCode?' ✓':''}</button>`).join('')}</div></div><div class="choice-group"><span class="choice-label">Tárhely</span><div class="choices">${storages.map(n=>`<button class="choice ${variant.storageGb===n?'selected':''}" data-storage="${n}" aria-pressed="${variant.storageGb===n}">${n} GB${variant.storageGb===n?' ✓':''}</button>`).join('')}</div></div><div class="price-section"><span class="metadata">Készülékár</span><div class="price">${money(variant.price.amount)}</div><span class="metadata">Egyszeri készülékár · fiktív demóár</span><div class="purchase-actions"><div class="quantity"><button data-action="qty-less" aria-label="Mennyiség csökkentése" ${S.qty<=1?'disabled':''}>−</button><span aria-live="polite">${S.qty}</span><button data-action="qty-more" aria-label="Mennyiség növelése" ${S.qty>=5?'disabled':''}>+</button></div><button class="primary desktop-add" data-action="add" ${unavailable?'disabled':''}>Kosárba teszem ▱</button></div><p class="metadata">♧ A rendelés kipróbálható, de nem jár valódi vásárlással.</p></div></section></div><section class="specs"><h2>Ismerd meg közelebbről</h2><details open><summary>Főbb jellemzők</summary><table class="spec-table"><tr><th>Kijelző</th><td>${escapeHtml(prod.highlights[0])}</td></tr><tr><th>Tárhely</th><td>${variant.storageGb} GB</td></tr><tr><th>Hátlapi kamera</th><td>50 MP · demóadat</td></tr><tr><th>Kapcsolat</th><td>${prod.is5g?'5G':'4G'}, Wi-Fi, Bluetooth</td></tr><tr><th>Adatforrás</th><td>Fiktív demóadatok</td></tr></table></details><details><summary>Méretek és kialakítás</summary><p class="small muted">Egységes, általános készülék-illusztráció. Pontos fizikai méretek nem tartoznak a demóhoz.</p></details><details><summary>Mit jelent a demó rendelés?</summary><p class="small muted">A folyamat bemutatja a vásárlást. Nem küldünk valódi rendelést, e-mailt vagy csomagot, és nem terhelünk bankkártyát.</p></details></section><div class="mobile-buy"><div><div class="metadata">Egyszeri demóár</div><div class="price">${money(variant.price.amount)}</div></div><button class="primary" data-action="add" ${unavailable?'disabled':''}>Kosárba teszem</button></div>`}</main>${footer()}`}
function stepper(){let n=['cart','contact','delivery','review','success'].indexOf(S.screen);return `<nav class="steps" aria-label="Vásárlás lépései">${['Kosár','Adatok','Szállítás','Ellenőrzés'].map((x,i)=>`<div class="step ${i===n?'current':i<n?'done':''}" ${i===n?'aria-current="step"':''}><span class="step-num">${i<n?'✓':i+1}</span>${x}</div>`).join('')}</nav>`}
function lineItems(review=false){return S.cart.map((l,i)=>{const a=PRODUCTS[l.p],b=a.variants[l.v];return `<div class="line-item">${img(b,'front','line-image',a.name+' illusztrációja')}<div><h3>${a.name}</h3><div class="metadata">${b.storageGb} GB · ${b.colorName}</div><div class="metadata" style="margin-top:8px">${l.qty} db · ${money(b.price.amount)}/db</div>${review?'':`<div class="quantity"><button data-line-minus="${i}" aria-label="${a.name} mennyiségének csökkentése" ${l.qty<=1?'disabled':''}>−</button><span>${l.qty}</span><button data-line-plus="${i}" aria-label="${a.name} mennyiségének növelése" ${l.qty>=5?'disabled':''}>+</button></div>`}</div><div class="line-total"><div class="price">${money(b.price.amount*l.qty)}</div>${review?'':`<button class="text-button" data-remove="${i}">Eltávolítás</button>`}</div></div>`}).join('')}
function summaryPanel(action=''){const isCart=S.screen==='cart';return `<aside class="panel summary-panel" aria-label="Rendelési összesítő"><h2>Rendelési összesítő</h2><div class="money-row"><span>Készülékek (${count()} db)</span><span>${money(subtotal())}</span></div><div class="money-row"><span>Szállítás</span><span>${isCart?'Később választod ki':money(fee())}</span></div><div class="summary-total"><div class="small">${isCart?'Készülékek összesen':'Összesen, egyszeri fizetés'}</div><div class="price">${money(subtotal()+(isCart?0:fee()))}</div></div>${action}<p class="metadata">♧ Demóadatok. Nincs valódi fizetés vagy megrendelés.</p></aside>`}
function field(name,label,type,value,placeholder='',errorText=''){return `<label class="field">${label}<input name="${name}" type="${type}" value="${escapeHtml(value)}" placeholder="${placeholder}" ${errorText?'aria-invalid="true" aria-describedby="error-'+name+'"':''}>${errorText?`<span class="field-error" id="error-${name}">${errorText}</span>`:''}</label>`}
function contactBody(){const invalid=S.state==='invalid'||S.errors;return `<section class="panel"><h1>Kapcsolattartási adatok</h1><p class="muted small">Add meg, kinek készül a demórendelés.</p><div class="notice"><strong>Kizárólag tesztadatokat használj.</strong>Ez a bemutató nem küld e-mailt vagy értesítést. A kapcsolattartási adatokat nem mentjük el böngészőtárhelyre.</div>${S.state==='error'?error('Nem sikerült elmenteni az adatokat.','A beírt mezők megmaradtak. Próbáld újra.') :invalid?'<div class="notice error" role="alert"><strong>Ellenőrizd a megadott adatokat.</strong>A kiemelt mezők javítása után folytathatod.</div>':''}<form id="contact-form" novalidate><div class="form-stack">${field('name','Teljes név','text',S.contact.name,'Teszt Elek',invalid&&S.contact.name.length<2?'Legalább 2 karaktert adj meg.':'')}${field('email','E-mail-cím','email',S.contact.email,'teszt@example.test',invalid&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.contact.email)?'Adj meg egy érvényes teszt e-mail-címet.':'')}${field('phone','Telefonszám','tel',S.contact.phone,'+36201234567',invalid&&!/^\+36\d{8,9}$/.test(S.contact.phone)?'A szám +36-tal kezdődjön, utána 8–9 számjegy álljon.':'')}</div><button type="button" class="text-button small" data-action="fill-demo">Tesztadatok kitöltése</button><div class="actions"><a class="btn" href="#/cart">← Vissza a kosárhoz</a><button class="primary" type="submit">Tovább a szállításhoz →</button></div></form></section>`}
function deliveryBody(){return `<section class="panel"><h1>Átvétel és fizetés</h1><p class="small muted">Válaszd ki a demó szállítási és fizetési módot.</p>${S.state==='error'?error('A szállítási adatokat most nem sikerült menteni.','A választásaid és a megadott tesztcím megmaradtak.'):''}<form id="delivery-form"><fieldset class="subsection" style="padding-top:8px"><legend class="sr-only">Szállítási mód</legend><h2>Hogyan vennéd át?</h2><label class="radio-card ${S.delivery==='home_delivery'?'selected':''}"><input type="radio" name="delivery" value="home_delivery" ${S.delivery==='home_delivery'?'checked':''}><span><strong>Házhoz szállítás – demó</strong><small>Fiktív kézbesítés; nem indul valódi csomag.</small></span><span class="radio-price">1 990 Ft</span></label><label class="radio-card ${S.delivery==='demo_pickup'?'selected':''}"><input type="radio" name="delivery" value="demo_pickup" ${S.delivery==='demo_pickup'?'checked':''}><span><strong>Demó átvételi pont</strong><small>Virtuális átvételi lehetőség, nincs valós üzletcím.</small></span><span class="radio-price">0 Ft</span></label>${S.delivery==='home_delivery'?`<div class="form-stack"><div class="field-grid">${field('zip','Irányítószám','text',S.address.zip,'1111')}${field('city','Település','text',S.address.city,'Demóváros')}</div>${field('street','Utca, házszám','text',S.address.street,'Példa utca 1.')}<span class="metadata">Ország: Magyarország · Kizárólag tesztcímet adj meg.</span></div><button type="button" class="text-button small" data-action="fill-address">Tesztcím kitöltése</button>`:''}</fieldset><fieldset class="subsection"><legend class="sr-only">Fizetési mód</legend><h2>Hogyan fizetnél?</h2><label class="radio-card ${S.payment==='demo_cod'?'selected':''}"><input type="radio" name="payment" value="demo_cod" ${S.payment==='demo_cod'?'checked':''}><span><strong>Utánvét – szimuláció</strong><small>Nem jár valódi átvétellel vagy fizetéssel.</small></span></label><label class="radio-card ${S.payment==='demo_card'?'selected':''}"><input type="radio" name="payment" value="demo_card" ${S.payment==='demo_card'?'checked':''}><span><strong>Bankkártya – szimuláció</strong><small>Nem kérünk kártyaszámot, CVC-kódot vagy banki jóváhagyást.</small></span></label></fieldset>${S.errors?'<div class="notice error" role="alert">Adj meg négyjegyű teszt irányítószámot, települést és címet.</div>':''}<div class="actions"><a class="btn" href="#/contact">← Vissza az adatokhoz</a><button class="primary" type="submit">Tovább az ellenőrzéshez →</button></div></form></section>`}
function reviewBody(){let extra='';if(S.state==='declined')extra=error('A szimulált fizetés elutasítva.','A kosarad és az adataid megmaradtak. Próbáld újra, vagy módosítsd a fizetési módot.');if(S.state==='expired')extra=error('Az összesítés érvényessége lejárt.','Kérj friss összesítést, és ellenőrizd újra az összegeket a rendelés előtt.');if(S.state==='price-changed')extra=error('Megváltozott egy készülék demóára.','Az új árat jóvá kell hagynod. A rendszer nem rendeli meg automatikusan a módosult összeggel.');return `<section class="panel"><h1>Minden rendben?</h1><p class="small muted">Ellenőrizd a rendelésedet a véglegesítés előtt.</p>${extra||'<p class="stock">✓ Friss demóárak · az ajánlat 5 percig érvényes.</p>'}${S.state==='submitting'?'<div class="notice" role="status"><strong>A demórendelés feldolgozás alatt…</strong>Nem küldünk újabb rendelést ismételt kattintásra.</div>':''}${lineItems(true)}<section class="subsection"><div class="subsection-head"><h3>Kapcsolattartás</h3><a href="#/contact" class="btn text-button">Módosítás</a></div><p>${escapeHtml(S.contact.name||'Teszt Elek')} · ${escapeHtml(S.contact.email||'teszt@example.test')}<br>${escapeHtml(S.contact.phone||'+36201234567')}</p></section><section class="subsection"><div class="subsection-head"><h3>Átvétel és fizetés</h3><a href="#/delivery" class="btn text-button">Módosítás</a></div><p>${S.delivery==='home_delivery'?'Házhoz szállítás · 1 990 Ft<br>'+escapeHtml((S.address.zip||'1111')+' '+(S.address.city||'Demóváros')+', '+(S.address.street||'Példa utca 1.')):'Demó átvételi pont · 0 Ft · virtuális helyszín'}<br>${S.payment==='demo_cod'?'Utánvét':'Bankkártya'} · szimuláció</p></section><div style="padding-top:16px"><label class="check"><input type="checkbox" id="consent-a" ${S.consentA?'checked':''}>Tudomásul veszem, hogy ez egy demó, nem valódi vásárlás.</label><label class="check"><input type="checkbox" id="consent-b" ${S.consentB?'checked':''}>Elfogadom a demó rendelési feltételeit.</label><button class="text-button small" data-action="terms">A demó működési feltételei</button></div><a href="#/delivery" class="btn text-button small" style="margin-top:12px">← Vissza a szállításhoz</a></section>`}
function successBody(){const r=S.receipt||{id:'DEMO-000001',total:341980,qty:1,name:'Demo One 5G',delivery:'Házhoz szállítás – demó',payment:'Utánvét – szimuláció'};return `<section class="panel"><div class="receipt-symbol" aria-hidden="true">✓</div><h1>Elkészült a demórendelésed.</h1><p class="muted">Végigpróbáltad a MiBolt vásárlási folyamatát.</p><div class="notice success"><strong>Ez kizárólag szimuláció.</strong>Nem történt valódi fizetés, nem indul kiszállítás, és nem küldtünk e-mailt.</div><div class="subsection"><div class="metadata">Demó rendelési azonosító</div><div class="receipt-id">${r.id}</div></div><div class="subsection"><h3>${r.name}</h3><p>${r.qty} db · fiktív demótermék</p><p>${r.delivery}<br>${r.payment}</p></div><div class="subsection"><div class="small">Összesen, egyszeri demóösszeg</div><div class="price" style="margin-top:8px">${money(r.total)}</div></div><div class="actions"><button class="primary" data-action="finish">Vissza a telefonokhoz →</button></div></section>`}
function checkout(){const empty=S.screen==='cart'&&(S.state==='empty'||!S.cart.length);let body='';if(empty)body='<div class="empty-state"><div class="empty-symbol" aria-hidden="true">▱</div><h1>A kosarad még üres.</h1><p>Nézd meg a demókészülékeket, és válaszd ki a kedvenced.</p><a class="btn primary" href="#/catalogue">Telefonokat nézek →</a></div>';else if(S.screen==='cart')body=`<div class="checkout-grid"><section class="panel"><h1>A kosarad</h1><p class="small muted">${count()} demókészülék. Minden ár egyszeri készülékár.</p>${S.state==='error'?error('A kosár módosítása nem sikerült.','A korábbi tartalom megmaradt. Ellenőrizd és próbáld újra.'):''}${lineItems()}<a href="#/catalogue" class="btn text-button small" style="margin-top:16px">← Még nézelődöm</a></section>${summaryPanel('<a class="btn primary" href="#/contact">Tovább az adatokhoz →</a>')}</div>`;else if(S.screen==='contact')body=`<div class="checkout-grid">${contactBody()}${summaryPanel()}</div>`;else if(S.screen==='delivery')body=`<div class="checkout-grid">${deliveryBody()}${summaryPanel()}</div>`;else if(S.screen==='review')body=`<div class="checkout-grid">${reviewBody()}${summaryPanel(`<button class="primary" id="place-order" data-action="submit-order" ${!(S.consentA&&S.consentB)||S.state!=='default'?'disabled':''}>${S.state==='submitting'?'Feldolgozás…':'Demórendelés véglegesítése'}</button>`)}</div>`;else body=S.state==='error'?error('A visszaigazolás most nem érhető el.','A rendelést nem adjuk le még egyszer. Az eredeti demóazonosítóval próbáljuk újra lekérni.'):`<div style="max-width:880px;margin:auto">${successBody()}</div>`;return `${header(true)}<main id="main" class="checkout-bg"><div class="container page">${stepper()}${body}</div></main>${footer()}`}
function render(){document.title='MiBolt · '+({'home':'Főoldal','catalogue':'Mobiltelefonok','product':p().name,'cart':'Kosár','contact':'Kapcsolattartás','delivery':'Átvétel és fizetés','review':'Ellenőrzés','success':'Demó visszaigazolás'}[S.screen]);document.getElementById('app').innerHTML=S.screen==='home'?home():S.screen==='catalogue'?catalogue():S.screen==='product'?product():checkout();document.getElementById('screen-select').value=S.screen;document.getElementById('state-select').innerHTML=stateOptions[S.screen].map(([id,label])=>`<option value="${id}" ${S.state===id?'selected':''}>${label}</option>`).join('');if(document.getElementById('sort'))document.getElementById('sort').value=S.sort;if(document.getElementById('page-size'))document.getElementById('page-size').value=S.pageSize;bind()}
let returnFocus=null;function openDialog(title,body,drawer=false,foot=''){returnFocus=document.activeElement;const d=document.getElementById('dialog');d.className='modal'+(drawer?' drawer':'');d.innerHTML=`<div class="modal-head"><h2 id="dialog-title" tabindex="-1">${title}</h2><button class="icon-button" data-action="close" aria-label="Ablak bezárása">×</button></div><div class="modal-body">${body}</div>${foot?'<div class="modal-foot">'+foot+'</div>':''}`;d.showModal();d.querySelector('h2').focus();bindDialog()}
function closeDialog(){document.getElementById('dialog').close();returnFocus?.focus()}
function bindDialog(){document.querySelectorAll('#dialog [data-action="close"]').forEach(x=>x.onclick=closeDialog);const apply=document.querySelector('#dialog [data-action="apply-filters"]');if(apply)apply.onclick=()=>{readFilters(document.getElementById('dialog'));closeDialog();render()};document.querySelectorAll('#dialog a').forEach(x=>x.addEventListener('click',closeDialog))}
function readFilters(root){let x=root.querySelector('[name=search]');if(!x)return;S.search=x.value;S.brand=[...root.querySelectorAll('[name=brand]:checked')].map(x=>x.value).join('|')||'all';S.storage=root.querySelector('[name=storage]:checked')?.value||'';S.only5g=root.querySelector('[name=only5g]').checked;S.stock=root.querySelector('[name=stock]').checked;S.min=root.querySelector('[name=min]').value;S.max=root.querySelector('[name=max]').value;S.page=1}
function clearFilters(){Object.assign(S,{search:'',brand:'all',storage:'',only5g:false,stock:false,min:'',max:'',page:1,state:'default'});go('catalogue')}
function saveContact(){const f=document.getElementById('contact-form');if(f){const d=new FormData(f);S.contact={name:String(d.get('name')),email:String(d.get('email')),phone:String(d.get('phone'))}}}
function saveAddress(){const f=document.getElementById('delivery-form');if(f){const d=new FormData(f);if(d.has('zip'))S.address={zip:String(d.get('zip')),city:String(d.get('city')),street:String(d.get('street'))}}}
function doAction(a){if(a==='info'||a==='terms')openDialog(a==='terms'?'A demó működési feltételei':'Hogyan működik a MiBolt demó?',`<p>Ez egy <strong>kattintható tervezési prototípus</strong>. A végleges Angular alkalmazás és az MSW API a külön specifikáció szerint készül el.</p><p>A készülékek, az árak és a rendelések fiktívek. Nem történik valódi fizetés, kiszállítás vagy e-mail-küldés. Kártyaadatokat nem kérünk.</p><p>Kizárólag tesztadatokat használj. A prototípus egy munkameneten belül mutatja be a folyamatot, frissítéskor alaphelyzetbe áll. A végleges MSW alkalmazás kosár- és demóvisszaigazolás-megőrzését az architektúraterv írja le.</p>`);if(a==='menu')openDialog('Menü','<nav><a href="#/home">Főoldal</a><a href="#/catalogue">Mobiltelefonok</a><a href="#/cart">Kosár</a></nav>',true);if(a==='how')document.getElementById('how')?.scrollIntoView();if(a==='filters')openDialog('Szűrők',filters(),true,'<button data-action="close">Mégse</button><button class="primary" data-action="apply-filters">Szűrők alkalmazása</button>');if(a==='retry'){S.state='default';S.errors=false;go(S.screen)}if(a==='clear-filters')clearFilters();if(a==='qty-less'){S.qty=Math.max(1,S.qty-1);render()}if(a==='qty-more'){S.qty=Math.min(5,S.qty+1);render()}if(a==='gallery-prev'||a==='gallery-next'){S.view=S.view==='front'?'back':'front';render()}if(a==='zoom')openDialog('Termékkép nagyítása',img(v(),S.view));if(a==='add'){const found=S.cart.find(x=>x.p===S.product&&x.v===S.variant);if(found)found.qty=Math.min(5,found.qty+S.qty);else S.cart.push({p:S.product,v:S.variant,qty:S.qty});render();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=`<strong>✓ A készülék a kosaradba került.</strong>${p().name} · ${v().storageGb} GB · ${v().colorName}<br><a href="#/cart">Tovább a kosárhoz →</a>`;document.body.append(t);setTimeout(()=>t.remove(),6000)}if(a==='fill-demo'){S.contact={name:'Teszt Elek',email:'teszt@example.test',phone:'+36201234567'};S.errors=false;S.state='default';render()}if(a==='fill-address'){S.address={zip:'1111',city:'Demóváros',street:'Példa utca 1.'};render()}if(a==='submit-order'){if(!S.consentA||!S.consentB||S.state!=='default')return;S.receipt={id:'DEMO-000001',total:subtotal()+fee(),qty:count(),name:S.cart.length===1?PRODUCTS[S.cart[0].p].name:'Több demókészülék',delivery:S.delivery==='home_delivery'?'Házhoz szállítás – demó':'Demó átvételi pont',payment:S.payment==='demo_cod'?'Utánvét – szimuláció':'Bankkártya – szimuláció'};S.cart=[];go('success')}if(a==='finish')go('catalogue')}
function bind(){document.querySelectorAll('#app [data-action]').forEach(x=>x.onclick=e=>{e.preventDefault();doAction(x.dataset.action)});document.querySelectorAll('[data-product]').forEach(x=>x.onclick=()=>{S.product=+x.dataset.product;S.variant=Math.max(0,p().variants.findIndex(z=>z.id===x.dataset.variant));S.view='front';S.qty=1;if(S.screen==='product')render()});document.querySelectorAll('[data-shortcut]').forEach(x=>x.onclick=()=>{S.only5g=x.dataset.shortcut==='5g';S.stock=x.dataset.shortcut==='stock'});document.querySelectorAll('[data-view]').forEach(x=>x.onclick=()=>{S.view=x.dataset.view;render()});document.querySelectorAll('[data-color]').forEach(x=>x.onclick=()=>{const k=p().variants.findIndex(z=>z.colorCode===x.dataset.color&&z.storageGb===v().storageGb);if(k>=0){S.variant=k;render()}});document.querySelectorAll('[data-storage]').forEach(x=>x.onclick=()=>{const k=p().variants.findIndex(z=>z.storageGb==x.dataset.storage&&z.colorCode===v().colorCode);if(k>=0){S.variant=k;render()}});document.querySelectorAll('[data-line-minus]').forEach(x=>x.onclick=()=>{S.cart[+x.dataset.lineMinus].qty=Math.max(1,S.cart[+x.dataset.lineMinus].qty-1);render()});document.querySelectorAll('[data-line-plus]').forEach(x=>x.onclick=()=>{S.cart[+x.dataset.linePlus].qty=Math.min(5,S.cart[+x.dataset.linePlus].qty+1);render()});document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{S.cart.splice(+x.dataset.remove,1);render()});document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{S.page=+x.dataset.page;render();window.scrollTo(0,0)});const sort=document.getElementById('sort');if(sort)sort.onchange=()=>{S.sort=sort.value;render()};const ps=document.getElementById('page-size');if(ps)ps.onchange=()=>{S.pageSize=+ps.value;S.page=1;render()};document.querySelectorAll('.desktop-filters input').forEach(x=>x.onchange=()=>{readFilters(document.querySelector('.desktop-filters'));render()});const search=document.getElementById('header-search');if(search)search.onsubmit=e=>{e.preventDefault();S.search=document.getElementById('global-search').value;go('catalogue')};const contact=document.getElementById('contact-form');if(contact){contact.oninput=saveContact;contact.onsubmit=e=>{e.preventDefault();saveContact();S.errors=!(S.contact.name.length>=2&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.contact.email)&&/^\+36\d{8,9}$/.test(S.contact.phone));S.errors?render():go('delivery')}}const delivery=document.getElementById('delivery-form');if(delivery){delivery.oninput=saveAddress;delivery.querySelectorAll('[name=delivery],[name=payment]').forEach(x=>x.onchange=()=>{saveAddress();S[x.name]=x.value;render()});delivery.onsubmit=e=>{e.preventDefault();saveAddress();S.errors=S.delivery==='home_delivery'&&!(/^[1-9]\d{3}$/.test(S.address.zip)&&S.address.city.length>=2&&S.address.street.length>=3);S.errors?render():go('review')}}for(const [id,key]of [['consent-a','consentA'],['consent-b','consentB']]){const el=document.getElementById(id);if(el)el.onchange=()=>{S[key]=el.checked;document.getElementById('place-order').disabled=!(S.consentA&&S.consentB)||S.state!=='default'}}}
document.getElementById('screen-select').onchange=e=>{if(['cart','contact','delivery','review'].includes(e.target.value))demoCart();go(e.target.value)};document.getElementById('state-select').onchange=e=>{if(S.screen==='contact'&&e.target.value==='invalid')S.contact={name:'',email:'teszt@',phone:'06'};if(S.screen==='cart'&&e.target.value==='default')demoCart();go(S.screen,e.target.value)};document.getElementById('reset-design').onclick=()=>location.reload();document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()}});window.addEventListener('hashchange',()=>{document.querySelectorAll('.toast').forEach(x=>x.remove());route()});route();
</script></body></html>

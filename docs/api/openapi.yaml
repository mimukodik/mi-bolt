openapi: 3.1.0
info:
  title: MiBolt Demo Commerce API
  version: 1.0.0
  description: Contract-first Angular MVP. Every operation is implemented with MSW;
    no live backend, billing, email or fulfillment. Demo values are fictional. JSON
    Schema constraints plus documented domain invariants are mandatory. All validation
    text is hu-HU at the UI boundary.
servers:
- url: /api/v1
  description: Same-origin logical endpoint; served only by MSW. Runtime root respects
    the Angular base href.
tags:
- name: Configuration
- name: Catalog
- name: Cart
- name: Checkout
- name: Payment
- name: Orders
security: []
paths:
  /config:
    get:
      operationId: getConfig
      tags:
      - Configuration
      summary: Read deterministic MiBolt demo configuration
      description: Read deterministic MiBolt demo configuration
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoConfig'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /products:
    get:
      operationId: listProducts
      tags:
      - Catalog
      summary: Search and filter product catalogue
      description: 'Filters apply conjunctively to one SAME variant. Returned defaultVariant
        is the cheapest matching variant with ID tie-break. Facet counts are disjunctive:
        remove own facet and count distinct matching products under all others. total
        counts products, never variants. Unknown query parameters return 400. An out-of-range
        page returns empty items with unchanged total; UI canonicalizes to final valid
        page with one refetch.'
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
        description: Case-insensitive NFC-normalized substring over brand/name; trimmed.
        style: form
        explode: true
      - name: brand
        in: query
        schema:
          type: array
          items:
            type: string
        description: Repeat brand=A&brand=B; OR within this facet, AND across facets.
        style: form
        explode: true
      - name: storageGb
        in: query
        schema:
          type: array
          items:
            type: integer
            enum:
            - 128
            - 256
            - 512
        description: Repeat parameter; OR within facet.
        style: form
        explode: true
      - name: minPrice
        in: query
        schema:
          type: integer
          minimum: 0
        description: Whole HUF inclusive; evaluated against variants, not unrelated
          cheapest variant.
        style: form
        explode: true
      - name: maxPrice
        in: query
        schema:
          type: integer
          minimum: 0
        description: Must be >= minPrice.
        style: form
        explode: true
      - name: inStock
        in: query
        schema:
          type: boolean
        description: ''
        style: form
        explode: true
      - name: is5g
        in: query
        schema:
          type: boolean
        description: ''
        style: form
        explode: true
      - name: featured
        in: query
        schema:
          type: boolean
        description: ''
        style: form
        explode: true
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - recommended
          - price_asc
          - price_desc
          - name_asc
          default: recommended
        description: Stable product ID tie-break. Matching selected variant determines
          price sorting.
        style: form
        explode: true
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: ''
        style: form
        explode: true
      - name: pageSize
        in: query
        schema:
          type: integer
          enum:
          - 12
          - 24
          default: 12
        description: ''
        style: form
        explode: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /products/{slug}:
    get:
      operationId: getProduct
      tags:
      - Catalog
      summary: Read product with complete variant matrix
      description: Read product with complete variant matrix
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /carts:
    post:
      operationId: createCart
      tags:
      - Cart
      summary: Create an empty demo cart
      description: Create an empty demo cart
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCartRequest'
  /carts/{cartId}:
    get:
      operationId: getCart
      tags:
      - Cart
      summary: Restore the authoritative mock cart
      description: Restore the authoritative mock cart
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /carts/{cartId}/items:
    post:
      operationId: addCartItem
      tags:
      - Cart
      summary: Add a variant or merge its quantity
      description: A repeated variant merges into one line. Quantity is positive;
        merged total <= min(stock,5). No silent clamping. One atomic successful mutation
        increments version once and invalidates quote/payment.
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/CartId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
  /carts/{cartId}/items/{itemId}:
    patch:
      operationId: setCartItemQuantity
      tags:
      - Cart
      summary: Set the absolute quantity of a cart line
      description: Set the absolute quantity of a cart line
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/CartId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetCartItemQuantityRequest'
    delete:
      operationId: removeCartItem
      tags:
      - Cart
      summary: Remove a cart line and return full updated cart
      description: Remove a cart line and return full updated cart
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/CartId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /checkout/options:
    get:
      operationId: getCheckoutOptions
      tags:
      - Checkout
      summary: Read local delivery and simulated payment choices
      description: Read local delivery and simulated payment choices
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOptions'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /checkout/{cartId}:
    get:
      operationId: getCheckoutSession
      tags:
      - Checkout
      summary: Read current in-memory checkout draft
      description: Read current in-memory checkout draft
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    put:
      operationId: updateCheckout
      tags:
      - Checkout
      summary: Merge validated contact, delivery or payment sections
      description: 'Uses cart version concurrency guard. Does not increment cart version:
        successful checkout changes invalidate quote and payment. Client serializes
        draft writes. Validate only supplied sections; partial state is permitted
        until quote/order. home_delivery requires address; pickup rejects address.'
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/CartId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
        '400':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCheckoutRequest'
  /checkout/{cartId}/quote:
    post:
      operationId: createCheckoutQuote
      tags:
      - Checkout
      summary: Revalidate stock and recompute final checkout quote
      description: No request body. All contact/delivery/payment sections must be
        complete and cart nonempty. Prices originate in mock catalogue. Quote lives
        5 minutes. If catalogue prices changed, atomically update cart prices and
        version, invalidate older quote and return 409 PRICE_CHANGED; require cart
        refetch and explicit review before new key/quote. Do not silently accept the
        new total.
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/CartId'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /payment-intents:
    post:
      operationId: createPaymentIntent
      tags:
      - Payment
      summary: Simulate payment approval without collecting card data
      description: Only permitted for demo_card and a current unexpired quote. Never
        request PAN, CVV, card expiry, bank redirect or external API. Declined/pending
        are valid states with 201, not server errors. New approved retry uses a new
        payment key; ambiguous network retry retains original key.
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentRequest'
  /payment-intents/{paymentIntentId}:
    get:
      operationId: getPaymentIntent
      tags:
      - Payment
      summary: Read a pending simulated payment result
      description: Read a pending simulated payment result
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/PaymentIntentId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders:
    post:
      operationId: createOrder
      tags:
      - Orders
      summary: Atomically commit one simulated order
      description: Replay idempotency result before examining cart status or expiry.
        Validate fresh quote/cart version, stock and consent; demo_card requires succeeded
        matching intent, demo_cod forbids intent. Atomically reserve/decrement mock
        stock, persist receipt and idempotency result, mark cart ordered and clear
        volatile contact/address. No real payment/email/shipping. On uncertain response,
        retry exact body/key; never create a new key automatically.
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
        '400':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags:
      - Orders
      summary: Read persisted privacy-minimized demo order receipt
      description: Read persisted privacy-minimized demo order receipt
      parameters:
      - $ref: '#/components/parameters/DemoSession'
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReceipt'
        '404':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Typed application or simulated transport failure; see Problem.code.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Money:
      type: object
      additionalProperties: false
      required:
      - amount
      - currency
      properties:
        amount:
          type: integer
          minimum: 0
          maximum: 100000000
          description: Whole Hungarian forints, NOT ISO minor units; no floating point
            or monthly fees.
        currency:
          type: string
          enum:
          - HUF
    Image:
      type: object
      additionalProperties: false
      required:
      - id
      - src
      - alt
      - width
      - height
      properties:
        id:
          type: string
        src:
          type: string
          pattern: ^/assets/
        alt:
          type: string
          minLength: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    Availability:
      type: string
      enum:
      - in_stock
      - out_of_stock
    Variant:
      type: object
      additionalProperties: false
      required:
      - id
      - colorCode
      - colorName
      - swatchHex
      - storageGb
      - price
      - availability
      - maxQuantity
      - images
      properties:
        id:
          type: string
        colorCode:
          type: string
        colorName:
          type: string
        swatchHex:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        storageGb:
          type: integer
          enum:
          - 128
          - 256
          - 512
        price:
          $ref: '#/components/schemas/Money'
        availability:
          $ref: '#/components/schemas/Availability'
        maxQuantity:
          type: integer
          minimum: 0
          maximum: 5
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          minItems: 1
    SpecRow:
      type: object
      additionalProperties: false
      required:
      - label
      - value
      properties:
        label:
          type: string
        value:
          type: string
    SpecGroup:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - rows
      properties:
        id:
          type: string
        title:
          type: string
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SpecRow'
          minItems: 1
    ProductSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - slug
      - brand
      - name
      - highlights
      - defaultVariant
      - is5g
      - isDemo
      properties:
        id:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        brand:
          type: string
        name:
          type: string

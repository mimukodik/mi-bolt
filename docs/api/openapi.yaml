  parameters:
    CartId:
      name: cartId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    PaymentIntentId:
      name: paymentIntentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    DemoSession:
      name: X-Demo-Session
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]{8,80}$
      description: Opaque tab-scoped namespace, injected by frontend interceptor.
        NOT an authentication or authorization mechanism.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
      description: Quoted current cart version, e.g. "3". Atomic compare-and-swap;
        mismatch returns 409 CART_VERSION_CONFLICT.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 100
      description: Key scoped to method + path + demo session, retained 24 hours.
        Same key and normalized body returns original result BEFORE current-version
        checks. Different body yields 409.
x-design-skill: mi-bolt-design
x-money-unit: integer whole HUF
